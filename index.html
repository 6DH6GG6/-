<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة XO | TECH</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

body {
  font-family: 'Cairo', sans-serif;
  background: #0f172a;
  color: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.game-card {
  background: rgba(30,41,59,0.85);
  border-radius: 20px;
  padding: 30px;
  width: 340px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

h1 {
  margin-bottom: 15px;
  font-weight: 900;
  background: linear-gradient(to right, #38bdf8, #818cf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

#board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 20px auto;
}

.cell {
  width: 90px;
  height: 90px;
  background: #1e293b;
  border-radius: 14px;
  font-size: 2.8rem;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.2s;
}

.cell:hover {
  background: #334155;
}

#status {
  margin: 15px 0;
  font-weight: bold;
}

button {
  background: linear-gradient(135deg, #38bdf8, #1d4ed8);
  border: none;
  color: white;
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 1rem;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="game-card">
  <h1>لعبة XO</h1>

  <div id="board">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>
  </div>

  <div id="status">الدور على: X</div>
  <button onclick="resetGame()">إعادة اللعب</button>
</div>

<script>
let currentPlayer = "X";
let cells = document.querySelectorAll(".cell");
let statusText = document.getElementById("status");
let gameActive = true;

const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

cells.forEach(cell => {
  cell.addEventListener("click", () => {
    if (cell.textContent || !gameActive) return;

    cell.textContent = currentPlayer;
    checkWin();

    if (gameActive) {
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      statusText.textContent = "الدور على: " + currentPlayer;
    }
  });
});

function checkWin() {
  for (let p of wins) {
    let [a,b,c] = p;
    if (
      cells[a].textContent &&
      cells[a].textContent === cells[b].textContent &&
      cells[a].textContent === cells[c].textContent
    ) {
      statusText.textContent = "🎉 الفائز: " + cells[a].textContent;
      gameActive = false;
      return;
    }
  }

  if ([...cells].every(c => c.textContent)) {
    statusText.textContent = "🤝 تعادل";
    gameActive = false;
  }
}

function resetGame() {
  cells.forEach(c => c.textContent = "");
  currentPlayer = "X";
  gameActive = true;
  statusText.textContent = "الدور على: X";
}
</script>

</body>
</html>

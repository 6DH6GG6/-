<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الجحيم</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}
body{background:#000;overflow:hidden}

/* ===== البوابة ===== */
.portal-screen{
position:fixed;
inset:0;
z-index:40000;
background:url('ALBOMS/IMAGE/SiteBackground/file_000000006e2c722f9a965efdf432912b.png') center/cover no-repeat;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
transition:1s;
}

.portal-screen.hidden{
opacity:0;
pointer-events:none;
}

.kingdom-title{
font-size:38px;
color:#8a2be2;
text-shadow:0 0 30px #8a2be2;
margin-bottom:30px;
animation:breath 4s infinite;
}

@keyframes breath{
0%,100%{opacity:0.3}
50%{opacity:1}
}

/* ===== البوابة ===== */
.door-container{
width:320px;
height:420px;
cursor:pointer;
transition:0.3s;
}

.door-container.disabled{
pointer-events:none;
filter:grayscale(1);
opacity:0.5;
}

/* ===== العداد ===== */
.attempts-counter{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
color:red;
padding:10px 20px;
border:2px solid red;
border-radius:10px;
z-index:50000;
}

/* ===== الفورم ===== */
.shadow-form{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#000;
border:3px solid red;
padding:20px;
width:300px;
display:none;
z-index:50000;
}

.shadow-form.active{display:block}

.shadow-form input,
.shadow-form select{
width:100%;
margin:10px 0;
padding:10px;
background:#111;
color:red;
border:1px solid red;
}

.shadow-form button{
width:100%;
padding:10px;
background:red;
color:#fff;
border:none;
cursor:pointer;
}

/* ===== الحظر ===== */
.ban-form{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#000;
border:3px solid red;
padding:20px;
color:red;
text-align:center;
display:none;
z-index:60000;
}

.ban-form.active{display:block}

/* ===== الموقع الرئيسي ===== */
.main-site{
position:fixed;
inset:0;
background:#111;
display:none;
justify-content:center;
align-items:center;
color:red;
font-size:26px;
z-index:10000;
}

.main-site.active{display:flex}
</style>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>

<!-- عداد -->
<div class="attempts-counter" id="counter">0</div>

<!-- البوابة -->
<div class="portal-screen" id="portal">

<div class="kingdom-title">مملكة الظلال</div>

<div class="door-container" id="door">
<model-viewer src="ALBOMS/3D/GLB/بوابة_العبور.glb"
camera-controls disable-zoom disable-pan></model-viewer>
</div>

</div>

<!-- الفورم -->
<div class="shadow-form" id="form">
<input id="name" placeholder="الاسم">
<input id="pass" type="password" placeholder="كلمة السر">

<select id="answer">
<option value="">اختر</option>
<option value="نعم">نعم</option>
<option value="لا">لا</option>
<option value="ناه">ناه</option>
</select>

<button onclick="check()">دخول</button>
</div>

<!-- الحظر -->
<div class="ban-form" id="ban">
<h3>تم الطرد</h3>
<button onclick="reset()">رجوع</button>
</div>

<!-- الموقع الرئيسي -->
<div class="main-site" id="main">
مرحباً بك في مملكة طائفة الظلام
</div>

<script>
let attempts = 0;

const correctPass = "1234";
const correctAnswer = "نعم";

const portal = document.getElementById("portal");
const door = document.getElementById("door");
const form = document.getElementById("form");
const ban = document.getElementById("ban");
const main = document.getElementById("main");
const counter = document.getElementById("counter");

/* فتح الفورم */
door.onclick = ()=>{
form.classList.add("active");
};

/* التحقق */
function check(){
let pass = document.getElementById("pass").value;
let answer = document.getElementById("answer").value;

if(pass === correctPass && answer === correctAnswer){
portal.classList.add("hidden");
main.classList.add("active");
}else{
attempts++;
counter.textContent = attempts;
form.classList.remove("active");

if(attempts >= 2){
ban.classList.add("active");
door.style.pointerEvents = "none";
}
}
}

/* إعادة */
function reset(){
ban.classList.remove("active");
attempts = 0;
counter.textContent = 0;
door.style.pointerEvents = "auto";
}
</script>

</body>
</html>

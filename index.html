<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Kage No Teio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold2:#f5e090;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Cinzel',serif}

#screen1{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse 80% 55% at 50% 0%,#1a0a2e 0%,#0d0118 45%,#04000a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .9s ease,z-index 0s linear .9s;
}
#screen1.fade-out{opacity:0;pointer-events:none;z-index:-1 !important;}

#screen1::before{
  content:'';position:absolute;
  top:5%;left:50%;transform:translateX(-50%);
  width:clamp(60px,11vw,130px);height:clamp(60px,11vw,130px);border-radius:50%;
  background:radial-gradient(circle at 38% 38%,#fff8e7,#f0d080 40%,#c9a84c 70%,#6b3a00 100%);
  box-shadow:0 0 60px 20px rgba(201,168,76,.3),0 0 110px 40px rgba(201,168,76,.1);
}

.s1-fog{
  position:absolute;height:90px;left:-10%;width:120%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 80%,rgba(180,160,220,.1),transparent 70%);
  animation:fogDrift var(--fd,18s) linear infinite;pointer-events:none;
}
@keyframes fogDrift{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(4%);opacity:.85}}

.s1-candle{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,180,60,.5),transparent 70%);
  animation:candleFlicker var(--cf,2s) ease-in-out infinite alternate;pointer-events:none;
}
@keyframes candleFlicker{0%{opacity:.5;transform:scale(1)}100%{opacity:.75;transform:scale(1.1)}}

#s1-sakura{position:absolute;inset:0;z-index:2;pointer-events:none}

#s1-castle{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:min(900px,100vw);z-index:1;opacity:.65;
  filter:drop-shadow(0 0 20px rgba(201,168,76,.15));
}

/* ✅ النص في النصف العلوي */
#welcome-block{
  position:absolute;
  top:0;left:0;right:0;
  height:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(6px,1.5vw,14px);
  text-align:center;
  padding:0 16px;
  pointer-events:none;
  z-index:6;
}

#welcome-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(18px,4.5vw,38px);
  color:#f5c800;
  letter-spacing:clamp(3px,1vw,8px);
  text-shadow:0 0 18px rgba(245,200,0,.7),0 0 40px rgba(245,200,0,.35);
  animation:titleGlow 2.5s ease-in-out infinite alternate;
}
@keyframes titleGlow{
  0%{text-shadow:0 0 14px rgba(245,200,0,.6),0 0 30px rgba(245,200,0,.25);}
  100%{text-shadow:0 0 28px rgba(255,215,0,.95),0 0 60px rgba(255,200,0,.5),0 0 90px rgba(255,180,0,.25);}
}

#welcome-sep{
  width:clamp(120px,35vw,300px);height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.6),rgba(245,200,0,.9),rgba(201,168,76,.6),transparent);
  box-shadow:0 0 10px rgba(245,200,0,.3);
}

#welcome-desc{
  font-family:'Cairo',sans-serif;
  font-size:clamp(11px,2.2vw,16px);
  color:rgba(240,220,160,.85);
  line-height:1.85;
  max-width:min(480px,88vw);
  letter-spacing:.5px;
  text-shadow:0 0 12px rgba(201,168,76,.2);
}

#welcome-show{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(12px,2.8vw,20px);
  color:var(--gold);
  letter-spacing:clamp(2px,0.8vw,6px);
  text-shadow:0 0 16px rgba(201,168,76,.55);
  animation:showPulse 1.8s ease-in-out infinite alternate;
}
@keyframes showPulse{
  0%{opacity:.65;text-shadow:0 0 10px rgba(201,168,76,.4);}
  100%{opacity:1;text-shadow:0 0 24px rgba(245,200,0,.85),0 0 50px rgba(201,168,76,.4);}
}

/* ✅ الزر في مركز الشاشة */
.gate-ring-wrap{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:5;
  width:clamp(120px,20vw,200px);height:clamp(120px,20vw,200px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .3s;
}
.gate-ring-wrap:hover{transform:translate(-50%,-50%) scale(1.07);}

.ring-outer{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;border-top-color:var(--gold);border-right-color:var(--gold2);
  animation:spinCW 6s linear infinite;
  box-shadow:0 0 24px rgba(201,168,76,.4),inset 0 0 20px rgba(201,168,76,.07);
}
.ring-outer2{
  position:absolute;inset:10px;border-radius:50%;
  border:1px solid rgba(201,168,76,.3);border-bottom-color:transparent;
  animation:spinCCW 9s linear infinite;
}
.ring-pulse{
  position:absolute;inset:-8px;border-radius:50%;
  border:1.5px solid rgba(201,168,76,.18);
  animation:ringPulse 2.4s ease-in-out infinite;
}
@keyframes spinCW{to{transform:rotate(360deg)}}
@keyframes spinCCW{to{transform:rotate(-360deg)}}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.07);opacity:.8}}

.ring-inner{
  position:relative;width:72%;height:72%;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,rgba(60,30,0,.95),rgba(10,0,20,.98));
  border:1.5px solid rgba(201,168,76,.5);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(201,168,76,.18),inset 0 0 28px rgba(0,0,0,.8);
  transition:box-shadow .4s;
}
.gate-ring-wrap:hover .ring-inner{box-shadow:0 0 70px rgba(201,168,76,.55),inset 0 0 30px rgba(201,168,76,.1)}

.gate-icon{font-size:clamp(28px,5.5vw,48px);animation:iconPulse 3s ease-in-out infinite}
@keyframes iconPulse{
  0%,100%{filter:drop-shadow(0 0 6px rgba(201,168,76,.5))}
  50%{filter:drop-shadow(0 0 18px rgba(201,168,76,.95)) drop-shadow(0 0 35px rgba(255,160,0,.4))}
}

#ember-canvas{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .4s;}
#ember-canvas.active{opacity:1;}

.gate-ring-wrap.ember-active .ring-outer{
  animation:spinCW .9s linear infinite !important;
  border-top-color:#ff4400;border-right-color:#ff8844;
  box-shadow:0 0 28px rgba(255,80,0,.5) !important;
}
.gate-ring-wrap.ember-active .ring-outer2{
  animation:spinCCW .7s linear infinite !important;
  border-color:rgba(255,100,0,.4);border-bottom-color:transparent;
}
.gate-ring-wrap.ember-active .ring-inner{
  box-shadow:0 0 50px rgba(220,60,0,.5),inset 0 0 24px rgba(180,40,0,.25) !important;
  border-color:rgba(255,100,0,.6) !important;
}
.gate-ring-wrap.ember-active .gate-icon{filter:drop-shadow(0 0 12px rgba(255,80,0,.9)) !important;}

@keyframes glitchShake{
  0%{transform:translate(-50%,-50%) skewX(0deg)}
  5%{transform:translate(calc(-50% - 6px),calc(-50% + 2px)) skewX(-4deg)}
  10%{transform:translate(calc(-50% + 6px),calc(-50% - 3px)) skewX(5deg)}
  15%{transform:translate(calc(-50% - 4px),calc(-50% + 4px)) skewX(-6deg)}
  20%{transform:translate(calc(-50% + 8px),calc(-50% - 2px)) skewX(3deg)}
  25%{transform:translate(calc(-50% - 5px),calc(-50% + 5px)) skewX(-5deg)}
  30%{transform:translate(calc(-50% + 7px),calc(-50% - 4px)) skewX(7deg)}
  50%{transform:translate(calc(-50% + 9px),calc(-50% + 2px)) skewX(6deg)}
  75%{transform:translate(calc(-50% - 4px),calc(-50% - 6px)) skewX(-6deg)}
  100%{transform:translate(-50%,-50%) skewX(0deg)}
}
@keyframes glitchColor{
  0%{filter:drop-shadow(0 0 6px rgba(201,168,76,.5))}
  10%{filter:hue-rotate(90deg) drop-shadow(4px 0 0 rgba(255,0,80,.9)) drop-shadow(-4px 0 0 rgba(0,255,255,.9)) brightness(2)}
  50%{filter:invert(1) brightness(2)}
  100%{filter:drop-shadow(0 0 6px rgba(201,168,76,.5))}
}
@keyframes glitchBorderFlash{
  0%,100%{border-color:rgba(201,168,76,.5)}
  15%{border-color:rgba(255,0,80,1);box-shadow:0 0 30px rgba(255,0,80,.9),inset 0 0 20px rgba(255,0,80,.3)}
  50%{border-color:rgba(255,255,0,1);box-shadow:0 0 50px rgba(255,255,0,.9),inset 0 0 30px rgba(255,255,0,.3)}
  85%{border-color:rgba(0,255,255,1);box-shadow:0 0 30px rgba(0,255,255,.9),inset 0 0 20px rgba(0,255,255,.3)}
}
.gate-ring-wrap.glitch-active{animation:glitchShake 1s steps(2) forwards !important;transform-origin:center center;}
.gate-ring-wrap.glitch-active .gate-icon{animation:glitchColor 1s steps(2) forwards !important;}
.gate-ring-wrap.glitch-active .ring-inner{animation:glitchBorderFlash 1s steps(2) forwards !important;}
.gate-ring-wrap.glitch-active .ring-outer{
  animation:spinCW .15s linear infinite !important;
  border-top-color:#ff0050;border-right-color:#00ffff;
  box-shadow:0 0 40px rgba(255,0,80,.8) !important;
}
.gate-ring-wrap.glitch-active .ring-outer2{
  animation:spinCCW .1s linear infinite !important;
  border-color:rgba(0,255,255,.8);border-bottom-color:transparent;
}
</style>
</head>
<body>

<canvas id="ember-canvas"></canvas>

<div id="screen1">
  <div class="s1-candle" style="width:80px;height:80px;bottom:36%;left:20%;--cf:2.1s"></div>
  <div class="s1-candle" style="width:54px;height:54px;bottom:34%;left:27%;--cf:2.7s"></div>
  <div class="s1-candle" style="width:80px;height:80px;bottom:36%;right:20%;--cf:1.9s"></div>
  <div class="s1-candle" style="width:54px;height:54px;bottom:34%;right:27%;--cf:2.4s"></div>
  <div class="s1-fog" style="bottom:18%;--fd:20s"></div>
  <div class="s1-fog" style="bottom:3%;--fd:16s;opacity:.65"></div>
  <svg id="s1-castle" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" fill="none">
    <rect x="0" y="460" width="900" height="60" fill="#0d0a04"/>
    <rect x="250" y="260" width="400" height="200" fill="#100c04"/>
    <rect x="360" y="120" width="180" height="200" fill="#0f0b03"/>
    <polygon points="450,30 330,140 570,140" fill="#1a1204"/>
    <path d="M400 460 Q400 390 450 390 Q500 390 500 460" fill="rgba(0,0,0,.8)" stroke="rgba(201,168,76,.2)" stroke-width="1.5"/>
  </svg>
  <canvas id="s1-sakura"></canvas>

  <div id="welcome-block">
    <div id="welcome-title">سيداتي &amp; سادتي</div>
    <div id="welcome-sep"></div>
    <div id="welcome-desc">
      امبراطور الظل يدعوكم لأمسية ممتعة<br>
      مع أول إنطلاقة لبوت فريد من نوعه<br>
      وأقوى بوت وأول عصابة تنشئ شيئاً كهذا<br>
      على مر تاريخ المواقع
    </div>
    <div id="welcome-sep"></div>
    <div id="welcome-show">✦ ليبدأ العرض ✦</div>
  </div>

  <div class="gate-ring-wrap" id="s1-gate-btn">
    <div class="ring-pulse"></div>
    <div class="ring-outer"></div>
    <div class="ring-outer2"></div>
    <div class="ring-inner"><div class="gate-icon">⛩️</div></div>
  </div>
</div>

<audio id="sfx-click" src="kps.ogg" preload="auto"></audio>
<audio id="sfx-bg" src="MUSIC_BG.ogg" preload="auto" loop></audio>

<script>
'use strict';

(function(){
  var cv=document.getElementById('s1-sakura'),ctx=cv.getContext('2d'),W,H,petals=[];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  function mkP(){return{x:Math.random()*W,y:-10,vx:(Math.random()-.5)*.8,vy:.4+Math.random()*.9,angle:Math.random()*Math.PI*2,va:(Math.random()-.5)*.04,r:2+Math.random()*4,a:Math.random()*.6+.2};}
  for(var i=0;i<35;i++){var p=mkP();p.y=Math.random()*H;petals.push(p);}
  (function loop(){
    ctx.clearRect(0,0,W,H);
    if(petals.length<55&&Math.random()<.25)petals.push(mkP());
    petals.forEach(function(p,i){
      p.x+=p.vx;p.y+=p.vy;p.angle+=p.va;
      if(p.y>H+10||p.x<-20||p.x>W+20)petals[i]=mkP();
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
      ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2);
      ctx.fillStyle='rgba(255,200,220,'+p.a+')';ctx.fill();ctx.restore();
    });
    requestAnimationFrame(loop);
  })();
})();

window.SoundManager={
  playClick:function(){
    var k=document.getElementById('sfx-click');
    if(k){k.currentTime=0;k.play().catch(function(){});}
  },
  playBG:function(){
    var b=document.getElementById('sfx-bg');
    if(b){b.volume=0.45;b.play().catch(function(){});}
  },
  stopBG:function(){
    var b=document.getElementById('sfx-bg');
    if(b){b.pause();b.currentTime=0;}
  }
};

var EmberEffect=(function(){
  var cv=document.getElementById('ember-canvas');
  var ctx=cv.getContext('2d');
  var W,H,embers=[],running=false,rafId=null;
  var cx=0,cy=0,radius=0;
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  function mkEmber(){
    var angle=Math.random()*Math.PI*2;
    var r=radius*(0.85+Math.random()*.35);
    var speed=0.012+Math.random()*.018;
    var dir=Math.random()>.5?1:-1;
    var size=1.5+Math.random()*2.5;
    return{angle:angle,r:r,speed:speed*dir,size:size,life:0.6+Math.random()*.4,decay:0.003+Math.random()*.004,rise:-(0.2+Math.random()*.5),drift:(Math.random()-.5)*.3};
  }
  function loop(){
    if(!running){ctx.clearRect(0,0,W,H);return;}
    ctx.clearRect(0,0,W,H);
    if(embers.length<28&&Math.random()<.35)embers.push(mkEmber());
    for(var i=embers.length-1;i>=0;i--){
      var e=embers[i];
      e.angle+=e.speed;e.life-=e.decay;
      if(e.life<=0){embers.splice(i,1);continue;}
      var ex=cx+Math.cos(e.angle)*e.r;
      var ey=cy+Math.sin(e.angle)*e.r+e.rise*((1-e.life)*40);
      ctx.beginPath();ctx.arc(ex,ey,e.size*e.life,0,Math.PI*2);
      var alpha=e.life*.85;
      ctx.fillStyle='rgba(255,80,0,'+alpha+')';
      ctx.shadowColor='rgba(255,60,0,'+(alpha*.8)+')';
      ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(ex,ey,e.size*.4*e.life,0,Math.PI*2);
      ctx.fillStyle='rgba(255,200,100,'+(alpha*.6)+')';ctx.fill();
    }
    rafId=requestAnimationFrame(loop);
  }
  function start(btnEl){
    if(running)return;running=true;
    cv.classList.add('active');btnEl.classList.add('ember-active');
    var rect=btnEl.getBoundingClientRect();
    cx=rect.left+rect.width/2;cy=rect.top+rect.height/2;radius=rect.width/2+18;
    for(var i=0;i<12;i++){var em=mkEmber();em.angle=Math.random()*Math.PI*2;embers.push(em);}
    rafId=requestAnimationFrame(loop);
  }
  function stop(btnEl){
    running=false;cancelAnimationFrame(rafId);
    cv.classList.remove('active');
    if(btnEl)btnEl.classList.remove('ember-active');
    embers=[];ctx.clearRect(0,0,W,H);
  }
  return{start:start,stop:stop};
})();

var BOT_SCRIPTS=[
  'BOT/core.js',
  'BOT/ui.js',
  'BOT/media.js',
  'BOT/files.js',
  'BOT/ai.js',
  'BOT/admin.js',
  'BOT/bot.js'
];

function loadScriptsInOrder(scripts,cb){
  var i=0;
  function next(){
    if(i>=scripts.length){if(cb)cb();return;}
    var s=document.createElement('script');
    s.src=scripts[i++];
    s.onload=next;
    s.onerror=function(){
      console.error('❌ فشل تحميل:',s.src);
      next();
    };
    console.log('⏳ تحميل:',scripts[i-1]);
    document.head.appendChild(s);
  }
  next();
}

var gateClicked=false;
var _skipReady=false;
var _t1=null,_t2=null;
var btn=document.getElementById('s1-gate-btn');

function doTransition(){
  if(doTransition._done)return;
  doTransition._done=true;

  clearTimeout(_t1);clearTimeout(_t2);
  btn.classList.remove('ember-active','glitch-active');
  EmberEffect.stop(btn);

  var s1=document.getElementById('screen1');
  s1.classList.add('fade-out');

  loadScriptsInOrder(BOT_SCRIPTS,function(){
    // ✅ ui.js ينشئ #bot-wrap بنفسه — ننتظره ثم نُظهره
    setTimeout(function(){
      s1.style.display='none';
      SoundManager.playBG();

      var wrap=document.getElementById('bot-wrap');
      if(wrap){
        wrap.style.display='flex';
        wrap.style.zIndex='500';
      }
    },50);
  });
}

document.addEventListener('click',function(e){
  if(!_skipReady)return;
  if(e.target.closest('#s1-gate-btn'))return;
  doTransition();
},{passive:true});

btn.addEventListener('click',function(){
  if(gateClicked)return;
  gateClicked=true;
  SoundManager.playClick();
  EmberEffect.start(btn);
  setTimeout(function(){_skipReady=true;},800);
  _t1=setTimeout(function(){
    btn.classList.remove('ember-active');
    btn.classList.add('glitch-active');
    _t2=setTimeout(doTransition,1000);
  },5000);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kage No Teio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
width:100%;
height:100vh;
overflow:hidden;
position:relative;
color:white;

/* ★ خلفية الموقع ★ */
background:
radial-gradient(circle at center,
rgba(255,0,0,.20) 0%,
rgba(30,0,0,.35) 30%,
rgba(0,0,0,1) 75%);

/* ★ ضع صورة الخلفية هنا ★ */
background-image:
url("background.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* ★ طبقة حمراء سوداء فوق الخلفية ★ */
body::before{
content:"";
position:absolute;
inset:0;

background:
radial-gradient(circle at center,
rgba(255,0,0,.25),
rgba(0,0,0,.92));

pointer-events:none;
}

/* ★ الشريط الأحمر ★ */
.top-alert{

width:100%;
height:48px;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(to right,
#300,
#c00,
#300);

font-weight:bold;
font-size:15px;

box-shadow:
0 0 15px red;

position:relative;
z-index:5;
}

/* ★ شريط الأزرار ★ */
.top-menu{

width:100%;

display:flex;
gap:10px;

overflow-x:auto;
white-space:nowrap;

padding:12px 10px;

background:#050505;

border-bottom:1px solid rgba(255,0,0,.3);

scrollbar-width:none;

position:relative;
z-index:5;
}

.top-menu::-webkit-scrollbar{
display:none;
}

/* ★ الأزرار العلوية ★ */
.menu-btn{

flex:none;

padding:12px 22px;

background:rgba(255,0,0,.04);

border:1px solid rgba(255,0,0,.55);

color:#ff4444;

font-weight:bold;

clip-path:polygon(
12% 0%,
88% 0%,
100% 20%,
100% 80%,
88% 100%,
12% 100%,
0% 80%,
0% 20%
);

box-shadow:
0 0 10px rgba(255,0,0,.35),
inset 0 0 12px rgba(255,0,0,.15);

transition:.3s;
}

.menu-btn:hover{

transform:
translateY(-3px);

box-shadow:
0 0 18px red,
0 0 35px rgba(255,0,0,.7);
}

/* ★ الصفحة ★ */
.main{

height:calc(100vh - 115px);

display:flex;
flex-direction:column;
justify-content:space-between;
align-items:center;

padding:10px;

position:relative;
z-index:2;
}

/* ★ بطاقة الحساب ★ */
.profile-box{

position:absolute;
top:8px;
right:10px;

display:flex;
align-items:center;
gap:10px;

padding:8px 14px;

background:rgba(255,0,0,.05);

border:2px solid rgba(255,0,0,.7);

clip-path:polygon(
10% 0%,
90% 0%,
100% 25%,
100% 75%,
90% 100%,
10% 100%,
0% 75%,
0% 25%
);

box-shadow:
0 0 15px red,
inset 0 0 15px rgba(255,0,0,.2);
}

.profile-name{
font-size:18px;
font-weight:bold;
color:#ff4444;
}

/* ★ صورة الحساب ★ */
.profile-box img{

width:55px;
height:55px;

object-fit:cover;

border-radius:50%;

border:2px solid red;

box-shadow:
0 0 15px red;
}

/* ★ الشعار ★ */
.logo{

margin-top:55px;

display:flex;
justify-content:center;
align-items:center;
}

/* ★ ضع شعار png هنا ★ */
.logo-img{

width:320px;
max-width:85%;

object-fit:contain;

filter:
drop-shadow(0 0 12px red)
drop-shadow(0 0 35px red);
}

/* ★ تشكيل النجمة ★ */
.portal-star{

width:100%;
max-width:850px;

display:grid;

grid-template-columns:
repeat(3,1fr);

justify-items:center;
align-items:center;

row-gap:25px;
}

/* ★ الصفوف ★ */
.row1,
.row2,
.row3,
.row4{

width:100%;

display:flex;
justify-content:center;
gap:140px;
}

/* ★ البوابة ★ */
.portal{

width:145px;
height:145px;

position:relative;

display:flex;
align-items:center;
justify-content:center;

background:transparent;

clip-path:polygon(
25% 6%,
75% 6%,
100% 50%,
75% 94%,
25% 94%,
0% 50%
);

border:3px solid rgba(255,0,0,.9);

box-shadow:
0 0 18px red,
0 0 45px rgba(255,0,0,.5),
inset 0 0 25px rgba(255,0,0,.2);

overflow:hidden;

transition:.4s;
}

/* ★ تأثير البوابات ★ */
.portal:hover{

transform:
translateY(-6px)
scale(1.08);

box-shadow:
0 0 25px red,
0 0 60px red;
}

/* ★ صور البوابات ★ */
.portal img{

width:88%;
height:88%;

object-fit:cover;

clip-path:polygon(
25% 6%,
75% 6%,
100% 50%,
75% 94%,
25% 94%,
0% 50%
);

/* ★ ضع صورة البوابة هنا ★ */
}

/* ★ اسم البوابة ★ */
.portal-title{

position:absolute;

bottom:-30px;
left:50%;

transform:translateX(-50%);

padding:6px 14px;

font-size:13px;
white-space:nowrap;

background:rgba(255,0,0,.05);

border:1px solid rgba(255,0,0,.6);

border-radius:15px;

box-shadow:
0 0 12px rgba(255,0,0,.4);
}

/* ★ الشريط السفلي ★ */
.bottom-bar{

width:100%;

display:flex;
justify-content:space-around;
align-items:center;

padding-bottom:18px;

transform:translateY(-12px);
}

/* ★ أزرار الأسفل ★ */
.bottom-icon{

width:72px;
height:72px;

display:flex;
align-items:center;
justify-content:center;

background:transparent;

border:2px solid rgba(255,0,0,.7);

clip-path:polygon(
15% 0%,
85% 0%,
100% 15%,
100% 85%,
85% 100%,
15% 100%,
0% 85%,
0% 15%
);

box-shadow:
0 0 15px rgba(255,0,0,.5),
inset 0 0 15px rgba(255,0,0,.15);

transition:.3s;
}

/* ★ صور أزرار الأسفل ★ */
.bottom-icon img{

width:65%;
height:65%;

object-fit:contain;

/* ★ ضع png هنا ★ */
}

/* ★ تأثير أزرار الأسفل ★ */
.bottom-icon:hover{

transform:
translateY(-8px)
scale(1.08);

box-shadow:
0 0 25px red,
0 0 50px rgba(255,0,0,.8);
}

/* ★ الهاتف ★ */
@media(max-width:700px){

.logo-img{
width:250px;
}

.portal{
width:110px;
height:110px;
}

.row2,
.row3{
gap:40px;
}

.portal-title{
font-size:11px;
}

.profile-box{
transform:scale(.82);
transform-origin:top right;
}

.bottom-icon{
width:58px;
height:58px;
}

}

</style>
</head>

<body>

<!-- ★ الشريط العلوي ★ -->
<div class="top-alert">
☠ الظلال تترس في الظلام ☠ طائفة الظلام 2019
</div>

<!-- ★ الأزرار العلوية ★ -->

<div class="menu-btn">الأرشيف</div>
<div class="menu-btn">الإعدادات</div>
<div class="menu-btn">قسم النقاط</div>
<div class="menu-btn">قسم البيع</div>
<div class="menu-btn">السجل</div>
<div class="menu-btn">المهام</div>
<div class="menu-btn">المتجر</div>
<div class="menu-btn">الرتب</div>
<div class="menu-btn">الزعماء</div>

</div>

<!-- ★ الصفحة ★ -->
<div class="main">

<!-- ★ الحساب ★ -->
<div class="profile-box">

<div class="profile-name">
Kage No Teio
</div>

<!-- ★ ضع صورة الحساب هنا ★ -->
<img src="profile.png">

</div>

<!-- ★ الشعار ★ -->
<div class="logo">

<!-- ★ ضع الشعار هنا ★ -->
<img src="logo.png" class="logo-img">

</div>

<!-- ★ تشكيل النجمة ★ -->
<div class="portal-star">

<!-- ★ 1 ★ -->
<div class="row1">

<div class="portal">
<img src="">
<div class="portal-title">البوابة العليا</div>
</div>

</div>

<!-- ★ 2 ★ -->
<div class="row2">

</div>

<div class="portal">
<img src="">

</div>

</div>

<!-- ★ 2 ★ -->
<div class="row3">

<div class="portal">
<img src="">
<div class="portal-title">الطائفة</div>
</div>

<div class="portal">
<img src="">

</div>

</div>

<!-- ★ 1 ★ -->
<div class="row4">

<div class="portal">

</div>

</div>

<!-- ★ أزرار الأسفل ★ -->
<div class="bottom-bar">

<div class="bottom-icon">
<img src="icon1.png">
</div>

<div class="bottom-icon">
<img src="icon2.png">
</div>

<img src="icon5.png">

</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kage No Teio</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:#000 url('background.jpg') center/cover no-repeat fixed;color:white;overflow-x:hidden;overflow-y:auto}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes moveStars{from{background-position:0 0}to{background-position:1000px}}
@keyframes scrollTextLeft{from{left:-100%}to{left:100%}}
@keyframes waveMove{0%{transform:translate(-50%,-50%) scale(1);opacity:0.9}100%{transform:translate(-50%,-50%) scale(25);opacity:0}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes portalSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes portalPulse{0%,100%{box-shadow:0 0 20px #ff0000,0 0 40px #ff0000,0 0 60px #8b0000}50%{box-shadow:0 0 40px #ff0000,0 0 80px #ff0000,0 0 120px #8b0000}}
@keyframes redPulse{0%,100%{box-shadow:0 0 30px #ff0000,0 0 60px #8b0000 inset,0 0 0 3px #ff0000}50%{box-shadow:0 0 50px #ff0000,0 0 100px #8b0000 inset,0 0 0 5px #ff1a1a}}
@keyframes hexGlow{0%,100%{filter:drop-shadow(0 0 15px #ff0000)}50%{filter:drop-shadow(0 0 30px #ff0000) drop-shadow(0 0 50px #8b0000)}}
.top-frame{position:fixed;top:0;left:0;right:0;height:40px;background:linear-gradient(270deg,#8b0000,#ff1a1a,#6a0dad,#8b0000);background-size:600% 600%;animation:gradientShift 8s ease infinite;z-index:10007;display:flex;align-items:center;overflow:hidden;border-bottom:1px solid rgba(255,0,0,0.5)}
.top-frame-text{position:absolute;width:100%;height:100%;display:flex;align-items:center;overflow:hidden;pointer-events:none}
.top-frame-text span{position:absolute;color:#fff;font-weight:bold;font-size:14px;white-space:nowrap;text-shadow:0 0 5px #000;animation:scrollTextLeft 15s linear infinite}
.top-nav{position:fixed;top:40px;left:0;right:0;height:50px;background:rgba(0,0,0,0.6);border-bottom:1px solid rgba(255,0,0,0.3);backdrop-filter:blur(8px);z-index:10006;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;overflow-x:auto;overflow-y:hidden}
.nav-btn{background:rgba(255,0,0,0.08);border:1px solid rgba(255,0,0,0.3);border-radius:6px;color:#ff4444;font-size:13px;font-weight:bold;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:0.1s;text-shadow:0 0 8px #ff0000;min-height:32px;position:relative;z-index:2}
.nav-btn:active{background:rgba(255,0,0,0.3);transform:scale(0.95)}
.profile-header{position:fixed;top:100px;right:15px;display:flex;align-items:center;z-index:10005}
.profile-name{background:rgba(0,0,0,0.7);color:#ff0000;font-size:15px;font-weight:bold;text-shadow:0 0 10px #ff0000;padding:6px 14px 6px 6px;border-radius:50px;border:2px solid #ff0000;box-shadow:0 0 20px rgba(255,0,0,0.5);display:flex;align-items:center;gap:8px}
.profile-img{width:32px;height:32px;border-radius:50%;border:2px solid #ff0000;object-fit:cover;box-shadow:0 0 15px rgba(255,0,0,0.6)}
#mainSite{display:block;position:relative;min-height:100vh}
.wave-layer{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.wave{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,rgba(255,0,0,0.35) 0%,rgba(255,0,0,0.15) 40%,transparent 70%);transform:translate(-50%,-50%);animation:waveMove 1.4s ease-out forwards;filter:blur(2px)}
.bg-overlay{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.6),rgba(0,0,0,0.85));z-index:1;pointer-events:none}
.stars{position:fixed;inset:0;background:url('866f30792413dcb70ce06c91c1ad3f4e.gif');opacity:0.12;animation:moveStars 120s linear infinite;z-index:2}
.portal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.98);z-index:20000;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:0.3s}
.portal-overlay.active{opacity:1;pointer-events:auto}
.portal-circle{width:200px;height:200px;border-radius:50%;border:4px solid #ff0000;background:radial-gradient(circle,rgba(255,0,0,0.2),transparent);animation:portalSpin 2s linear infinite,portalPulse 1.5s ease-in-out infinite;position:relative}
.portal-circle::before{content:"";position:absolute;inset:10px;border-radius:50%;border:3px solid #8b0000;animation:portalSpin 1.5s linear infinite reverse}
.portal-circle::after{content:"☠";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;color:#ff0000;text-shadow:0 0 30px #ff0000}
.menu-page{position:fixed;inset:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:0.15s ease}
.menu-page.active{opacity:1;pointer-events:auto}
.fancy-box{width:90%;max-width:500px;background:linear-gradient(145deg,#0a0000,#1a0000);border-radius:15px;padding:40px 30px;text-align:center;animation:redPulse 2s ease-in-out infinite}
.fancy-box h2{color:#ff0000;font-size:28px;margin-bottom:20px;text-shadow:0 0 20px #ff0000,0 0 40px #8b0000;letter-spacing:3px}
.fancy-box p{color:#ffcccc;font-size:20px;font-weight:bold;text-shadow:0 0 10px #ff0000;margin-bottom:30px}
.fancy-box button{padding:12px 35px;border:2px solid #ff0000;background:rgba(0,0,0,0.6);color:#ff0000;border-radius:10px;cursor:pointer;min-height:44px;font-weight:bold;font-size:16px;text-shadow:0 0 10px #ff0000;transition:0.2s;box-shadow:0 0 15px #ff0000}
.fancy-box button:active{background:#ff0000;color:black;transform:scale(0.95)}
.exit-popup{position:fixed;inset:0;background:url('exit-background.jpg') center/cover no-repeat;background-color:#000;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:0.15s;z-index:20001}
.exit-popup.active{opacity:1;pointer-events:auto}
.exit-box{background:rgba(0,0,0,0.85);padding:40px;border-radius:20px;text-align:center;box-shadow:0 0 40px #ff0000;border:3px solid #ff0000;width:90%;max-width:400px}
.exit-box h2{color:#ff0000;font-size:26px;margin-bottom:15px;text-shadow:0 0 15px #ff0000}
.exit-buttons{margin-top:20px;display:flex;gap:15px;justify-content:center}
.exit-buttons button{padding:12px 30px;border:2px solid #ff0000;background:#1a0000;color:#ff0000;border-radius:10px;cursor:pointer;min-height:44px;font-weight:bold;font-size:16px;transition:0.2s}
.exit-buttons button:active{background:#ff0000;color:black;transform:scale(0.95)}
.site-wrapper{min-height:100vh;display:flex;flex-direction:column;align-items:center;position:relative;z-index:3;padding-top:170px;padding-bottom:120px}
.logo{width:clamp(180px,45vw,420px);margin-top:15px;margin-bottom:15px;filter:drop-shadow(0 0 25px #ff0000);z-index:2}
.container{z-index:2;width:100%;display:flex;justify-content:center;padding:10px}
.fighter-grid{width:clamp(420px,95vw,1000px);position:relative;height:clamp(400px,85vw,750px)}
.hexagram-menu{position:relative;width:100%;height:100%}
.btn{position:absolute;width:30%;aspect-ratio:16/9;background-size:100% 100%;background-position:center;background-repeat:no-repeat;cursor:pointer;opacity:0;transform:translateY(40px);animation:fadeUp 0.8s ease forwards;min-height:100px;touch-action:manipulation;animation:hexGlow 3s ease-in-out infinite}
.btn::after{content:"";position:absolute;inset:0;z-index:1}
.btn:nth-child(1){top:0;left:50%;transform:translateX(-50%) translateY(40px);animation-delay:0.2s}
.btn:nth-child(1).show{transform:translateX(-50%) translateY(0)}
.btn:nth-child(2){top:16%;right:8%;animation-delay:0.4s}
.btn:nth-child(3){bottom:16%;right:8%;animation-delay:0.6s}
.btn:nth-child(4){bottom:0;left:50%;transform:translateX(-50%) translateY(40px);animation-delay:0.8s}
.btn:nth-child(4).show{transform:translateX(-50%) translateY(0)}
.btn:nth-child(5){bottom:16%;left:8%;animation-delay:1s}
.btn:nth-child(6){top:16%;left:8%;animation-delay:1.2s}
.btn:active{transform:scale(0.97);filter:drop-shadow(0 0 40px #ff0000)}
#character3D{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:35%;height:35%;z-index:5;cursor:pointer;border-radius:10px;display:flex;align-items:center;justify-content:center}
#character3D model-viewer{width:100%;height:100%;background:transparent}
.bottom-buttons{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10005}
.bottom-btn{width:clamp(70px,20vw,110px);height:clamp(60px,18vw,90px);background-size:100% 100%;background-position:center;background-repeat:no-repeat;cursor:pointer;opacity:0;animation:fadeUp 0.8s ease forwards;touch-action:manipulation;filter:drop-shadow(0 0 10px #ff0000)}
.bottom-btn:nth-child(1){animation-delay:1.4s}
.bottom-btn:nth-child(2){animation-delay:1.5s}
.bottom-btn:nth-child(3){animation-delay:1.6s}
.bottom-btn:nth-child(4){animation-delay:1.7s}
.bottom-btn:nth-child(5){animation-delay:1.8s}
.bottom-btn:active{transform:scale(0.95);filter:drop-shadow(0 0 25px #ff0000)}
@media (max-width:768px){.top-nav{padding:0 10px;justify-content:flex-start}.nav-btn{font-size:11px;padding:5px 8px}.fighter-grid{width:98vw;height:clamp(380px,95vw,650px)}.btn{width:32%;min-height:85px}#character3D{width:38%;height:38%}}
@media (max-width:480px){.profile-name{font-size:13px;padding:5px 12px 5px 6px}.profile-img{width:28px;height:28px}.bottom-buttons{gap:8px;bottom:10px}.fancy-box h2{font-size:22px}.fancy-box p{font-size:17px}.btn{width:34%;min-height:75px}.bottom-btn{width:clamp(65px,19vw,95px);height:clamp(55px,17vw,80px)}}
</style>
</head>
<body>
<div class="top-frame">
<div class="top-frame-text">
<span>☠ الظلال تتربص في الظلام ☠ طائفة الظلام 2019 ☠</span>
</div>
</div>
<div class="top-nav">
<button class="nav-btn" onclick="openFancyMenu('الأرشيف')">الأرشيف</button>
<button class="nav-btn" onclick="openFancyMenu('الإعدادات')">الإعدادات</button>
<button class="nav-btn" onclick="openFancyMenu('قسم النقاط')">قسم النقاط</button>
<button class="nav-btn" onclick="openFancyMenu('قسم شراء وبيع')">قسم شراء وبيع</button>
<button class="nav-btn" onclick="openFancyMenu('السجل')">السجل</button>
<button class="nav-btn" onclick="openFancyMenu('المهام')">المهام</button>
<button class="nav-btn" onclick="openFancyMenu('المتجر')">المتجر</button>
<button class="nav-btn" onclick="openFancyMenu('الرتب')">الرتب</button>
<button class="nav-btn" onclick="openFancyMenu('الحلفاء')">الحلفاء</button>
<button class="nav-btn" onclick="openFancyMenu('الدعم')">الدعم</button>
</div>
<div class="profile-header">
<div class="profile-name">
<img src="profile.jpg" class="profile-img" alt="Profile"> Kage No Teio
</div>
</div>
<div id="mainSite">
<div class="wave-layer" id="waveLayer"></div>
<div class="bg-overlay"></div>
<div class="stars"></div>
<div class="portal-overlay" id="portalOverlay">
<div class="portal-circle"></div>
</div>
<div class="exit-popup" id="exitPopup">
<div class="exit-box">
<h2>هل تريد الخروج الأخير؟</h2>
<div class="exit-buttons">
<button onclick="confirmExit()">نعم</button>
<button onclick="closeExit()">لا</button>
</div>
</div>
</div>
<div class="menu-page" id="menuPage">
<div class="fancy-box">
<h2 id="menuTitle"></h2>
<p>☠ قريباً يتم فتح هذه الميزة ☠</p>
<button onclick="closeMenuPage()">رجوع</button>
</div>
</div>
<div class="site-wrapper">
<img src="20260429_130547.png" class="logo" alt="Logo">
<div class="container">
<div class="fighter-grid">
<div class="hexagram-menu">
<div class="btn" onclick="openFancyMenu('أنمي')" style="background-image:url('20260426_155749.png')" aria-label="أنمي"></div>
<div class="btn" onclick="openFancyMenu('فضائح عصابات')" style="background-image:url('20260426_160952.png')" aria-label="فضائح عصابات"></div>
<div class="btn" onclick="openFancyMenu('قوانين الدعس')" style="background-image:url('20260426_155319.png')" aria-label="قوانين الدعس"></div>
<div class="btn" onclick="openFancyMenu('ترسيم أعضاء')" style="background-image:url('20260426_160315.png')" aria-label="ترسيم أعضاء"></div>
<div class="btn" onclick="openFancyMenu('أسماء الظلال')" style="background-image:url('20260426_160850.png')" aria-label="أسماء الظلال"></div>
<div class="btn" onclick="openFancyMenu('تحميل ملفات')" style="background-image:url('20260426_154329.png')" aria-label="تحميل ملفات"></div>
<div id="character3D" onclick="playCharacterSound()">
<!-- حط هنا model-viewer للشخصية GLB -->
<!-- <model-viewer src="character.glb" camera-controls auto-rotate></model-viewer> -->
</div>
</div>
</div>
</div>
</div>
</div>
<div class="bottom-buttons">
<div class="bottom-btn" onclick="openFancyMenu('B1')" style="background-image:url('file_00000000179c71fd83bf829866e3b70e.png')"></div>
<div class="bottom-btn" onclick="openFancyMenu('B2')" style="background-image:url('file_00000000279071fd99127e217cbfee58.png')"></div>
<div class="bottom-btn" onclick="openFancyMenu('B3')" style="background-image:url('file_00000000407c71f8968e21eab43ddc90.png')"></div>
<div class="bottom-btn" onclick="openFancyMenu('B4')" style="background-image:url('file_00000000ca8871fda085016e7d9113f3.png')"></div>
<div class="bottom-btn" onclick="openFancyMenu('B5')" style="background-image:url('file_00000000e4a871fd942da630c97a1c72.png')"></div>
</div>
<audio id="clickSound" src="clickSound.mp3" preload="auto"></audio>
<audio id="characterClick" src="characterClick.mp3" preload="auto"></audio>
<script>
let menuData = {"أنمي":"قسم الأنمي","فضائح عصابات":"أرشيف الفضائح","قوانين الدعس":"قوانين الطائفة","ترسيم أعضاء":"نظام الترسيم","أسماء الظلال":"قائمة الظلال","تحميل ملفات":"قسم التحميل","B1":"زر سفلي 1","B2":"زر سفلي 2","B3":"زر سفلي 3","B4":"زر سفلي 4","B5":"زر سفلي 5","الأرشيف":"قسم الأرشيف","الإعدادات":"إعدادات الحساب","قسم النقاط":"نظام النقاط","قسم شراء وبيع":"متجر المملكة","السجل":"سجل النشاطات","المهام":"المهام اليومية","المتجر":"متجر الأدوات","الرتب":"رتب المملكة","الحلفاء":"قائمة الحلفاء","الدعم":"تواصل مع الإدارة"};
function playClick(){const audio=document.getElementById('clickSound');if(audio){audio.currentTime=0;audio.play().catch(()=>{})}}
window.playCharacterSound=function(){const audio=document.getElementById('characterClick');if(audio){audio.currentTime=0;audio.play().catch(()=>{})}}
function openPortal(callback){const portal=document.getElementById("portalOverlay");portal.classList.add("active");setTimeout(()=>{portal.classList.remove("active");if(callback)callback()},800)}
window.openFancyMenu=function(title){playClick();openPortal(()=>{document.getElementById("menuTitle").innerText=menuData;document.getElementById("menuPage").classList.add("active");history.pushState({page:"menu"},"")})}
window.openMenuPortal=function(title){window.openFancyMenu(title)}
window.openMenu=function(title){window.openFancyMenu(title)}
window.closeMenuPage=function(){playClick();document.getElementById("menuPage").classList.remove("active")}
let exitArmed=false;
history.pushState({page:"home"},"");
window.addEventListener("popstate",function(e){
let menu=document.getElementById("menuPage");
if(menu.classList.contains("active")){menu.classList.remove("active");history.pushState({page:"home"},"");return}
document.getElementById("exitPopup").classList.add("active");
history.pushState({page:"home"},"");
});
window.confirmExit=function(){playClick();window.close();window.location.href="about:blank"}
window.closeExit=function(){playClick();document.getElementById("exitPopup").classList.remove("active")}
const waveLayer=document.getElementById("waveLayer");let canWave=true;document.addEventListener("pointerdown",createWave);
function createWave(e){if(!canWave)return;canWave=false;const wave=document.createElement("div");wave.className="wave";wave.style.left=e.clientX+"px";wave.style.top=e.clientY+"px";waveLayer.appendChild(wave);setTimeout(()=>{wave.remove();canWave=true},1200)}
document.querySelectorAll('button,.btn,.bottom-btn,.nav-btn').forEach(el=>{el.addEventListener('click',playClick)});
window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{document.querySelectorAll('.btn').forEach(btn=>{btn.style.opacity='1';if(btn.style.transform.includes('translateX')){btn.classList.add('show')}else{btn.style.transform='translateY(0)'}})},100)})
</script>
</body>
</html>

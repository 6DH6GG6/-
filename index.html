<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kage No Teio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
width:100%;
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at center,
rgba(255,0,0,.25) 0%,
rgba(40,0,0,.15) 25%,
rgba(0,0,0,1) 70%);
position:relative;
color:white;
}

/* ★ النجوم ★ */
body::before{
content:"";
position:absolute;
inset:0;

background-image:
radial-gradient(rgba(255,255,255,.8) 1px, transparent 1px),
radial-gradient(rgba(255,0,0,.5) 1px, transparent 1px);

background-size:70px 70px,120px 120px;
background-position:0 0,40px 40px;

opacity:.22;

animation:stars 25s linear infinite;

pointer-events:none;
}

@keyframes stars{
from{
transform:translateY(0);
}
to{
transform:translateY(-100px);
}
}

/* ★ الشريط الأحمر ★ */
.top-alert{

width:100%;
height:48px;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(to right,
#400,
#c00,
#400);

font-weight:bold;
font-size:15px;

box-shadow:
0 0 15px red;

z-index:5;
position:relative;
}

/* ★ شريط التنقل ★ */
.top-menu{

width:100%;

display:flex;
gap:10px;

overflow-x:auto;
white-space:nowrap;

padding:12px 10px;

background:#050505;

border-bottom:1px solid rgba(255,0,0,.3);

scrollbar-width:none;
}

.top-menu::-webkit-scrollbar{
display:none;
}

/* ★ الأزرار العلوية ★ */
.menu-btn{

flex:none;

padding:12px 22px;

background:rgba(255,0,0,.05);

border:1px solid rgba(255,0,0,.45);

color:#ff5555;

font-weight:bold;

clip-path:polygon(
12% 0%,
88% 0%,
100% 20%,
100% 80%,
88% 100%,
12% 100%,
0% 80%,
0% 20%
);

box-shadow:
0 0 10px rgba(255,0,0,.3),
inset 0 0 12px rgba(255,0,0,.15);

transition:.3s;
}

.menu-btn:hover{

transform:translateY(-2px);

box-shadow:
0 0 15px red,
0 0 30px rgba(255,0,0,.5);
}

/* ★ الصفحة ★ */
.main{

height:calc(100vh - 115px);

display:flex;
flex-direction:column;
justify-content:space-between;
align-items:center;

padding:10px;

position:relative;
}

/* ★ بطاقة الحساب ★ */
.profile-box{

position:absolute;
top:8px;
right:10px;

display:flex;
align-items:center;
gap:10px;

padding:8px 14px;

background:rgba(255,0,0,.05);

border:2px solid rgba(255,0,0,.7);

clip-path:polygon(
10% 0%,
90% 0%,
100% 25%,
100% 75%,
90% 100%,
10% 100%,
0% 75%,
0% 25%
);

box-shadow:
0 0 15px red,
inset 0 0 15px rgba(255,0,0,.2);

z-index:10;
}

.profile-name{
font-size:18px;
font-weight:bold;
color:#ff4444;
}

.profile-box img{

width:55px;
height:55px;

object-fit:cover;

border-radius:50%;

border:2px solid red;

box-shadow:
0 0 15px red;
}

/* ★ الشعار ★ */
.logo{

margin-top:55px;

display:flex;
justify-content:center;
align-items:center;
}

.logo-img{

width:320px;
max-width:85%;

object-fit:contain;

filter:
drop-shadow(0 0 10px red)
drop-shadow(0 0 35px red);
}

/* ★ الشبكة ★ */
.portal-grid{

width:100%;
max-width:950px;

display:grid;
grid-template-columns:repeat(3,1fr);

justify-items:center;

gap:55px 10px;

padding:20px;
}

/* ★ البوابات ★ */
.portal{

width:150px;
height:150px;

position:relative;

display:flex;
align-items:center;
justify-content:center;

background:transparent;

clip-path:polygon(
25% 6%,
75% 6%,
100% 50%,
75% 94%,
25% 94%,
0% 50%
);

border:3px solid rgba(255,0,0,.9);

box-shadow:
0 0 15px red,
0 0 40px rgba(255,0,0,.5),
inset 0 0 20px rgba(255,0,0,.2);

overflow:hidden;

transition:.4s;
}

/* ★ تأثير البوابات ★ */
.portal:hover{

transform:
scale(1.08)
translateY(-5px);

box-shadow:
0 0 25px red,
0 0 60px orange;
}

/* ★ صور البوابات ★ */
.portal img{

width:88%;
height:88%;

object-fit:cover;

clip-path:polygon(
25% 6%,
75% 6%,
100% 50%,
75% 94%,
25% 94%,
0% 50%
);

border:2px solid rgba(255,255,255,.15);
}

/* ★ اسم البوابة ★ */
.portal-title{

position:absolute;

bottom:-30px;
left:50%;

transform:translateX(-50%);

padding:6px 14px;

font-size:13px;
white-space:nowrap;

background:rgba(255,0,0,.05);

border:1px solid rgba(255,0,0,.6);

border-radius:15px;

box-shadow:
0 0 12px rgba(255,0,0,.4);
}

/* ★ الشريط السفلي ★ */
.bottom-bar{

width:100%;

display:flex;
justify-content:space-around;
align-items:center;

padding-bottom:15px;

/* يصعد لفوق قليلا */
transform:translateY(-12px);
}

/* ★ أزرار الأسفل ★ */
.bottom-icon{

width:72px;
height:72px;

display:flex;
align-items:center;
justify-content:center;

font-size:30px;

background:transparent;

border:2px solid rgba(255,0,0,.7);

clip-path:polygon(
15% 0%,
85% 0%,
100% 15%,
100% 85%,
85% 100%,
15% 100%,
0% 85%,
0% 15%
);

box-shadow:
0 0 15px rgba(255,0,0,.5),
inset 0 0 15px rgba(255,0,0,.15);

transition:.3s;
}

/* ★ تأثير الأزرار ★ */
.bottom-icon:hover{

transform:
translateY(-8px)
scale(1.08);

box-shadow:
0 0 25px red,
0 0 50px rgba(255,0,0,.8);
}

/* ★ الهاتف ★ */
@media(max-width:700px){

.logo-img{
width:250px;
}

.portal-grid{

grid-template-columns:repeat(2,1fr);

gap:55px 10px;
}

.portal{
width:120px;
height:120px;
}

.portal-title{
font-size:11px;
}

.profile-box{
transform:scale(.85);
transform-origin:top right;
}

.bottom-icon{

width:58px;
height:58px;

font-size:24px;
}

}

</style>
</head>

<body>

<!-- ★ الشريط العلوي ★ -->
<div class="top-alert">
☠ الظلال تترس في الظلام ☠ طائفة الظلام 2019
</div>

<!-- ★ أزرار الأعلى ★ -->
<div class="top-menu">

<div class="menu-btn">الأرشيف</div>
<div class="menu-btn">الإعدادات</div>
<div class="menu-btn">قسم النقاط</div>
<div class="menu-btn">قسم البيع</div>
<div class="menu-btn">السجل</div>
<div class="menu-btn">المهام</div>
<div class="menu-btn">المتجر</div>
<div class="menu-btn">الرتب</div>
<div class="menu-btn">الزعماء</div>

</div>

<!-- ★ الصفحة ★ -->
<div class="main">

<!-- ★ الحساب ★ -->
<div class="profile-box">

<div class="profile-name">
Kage No Teio
</div>

<img src="https://i.imgur.com/8Km9tLL.jpeg">

</div>

<!-- ★ الشعار ★ -->
<div class="logo">

<!-- ضع شعار PNG هنا -->
<img src="logo.png" class="logo-img">

</div>

<!-- ★ البوابات ★ -->
<div class="portal-grid">

<div class="portal">
<img src="https://i.imgur.com/8Km9tLL.jpeg">
<div class="portal-title">زعيم الظلال</div>
</div>

<div class="portal">
<img src="https://i.imgur.com/tXqF8Jw.jpeg">
<div class="portal-title">دار النار</div>
</div>

<div class="portal">
<img src="https://i.imgur.com/6VBx3io.jpeg">
<div class="portal-title">قسم المهام</div>
</div>

<div class="portal">
<img src="https://i.imgur.com/mYmmbrp.jpeg">
<div class="portal-title">مركز الأرواح</div>
</div>

<div class="portal">
<img src="https://i.imgur.com/oYiTqum.jpeg">
<div class="portal-title">بوابة الجحيم</div>
</div>

<div class="portal">
<img src="https://i.imgur.com/GZy7GQp.jpeg">
<div class="portal-title">الطائفة</div>
</div>

</div>

<!-- ★ الأزرار السفلية ★ -->
<div class="bottom-bar">

<div class="bottom-icon">🏆</div>

<div class="bottom-icon">📰</div>

<div class="bottom-icon">🎮</div>

<div class="bottom-icon">💰</div>

<div class="bottom-icon">🤖</div>

</div>

</div>

</body>
</html>

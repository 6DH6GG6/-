<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kage No Teio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
width:100%;
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at center,
rgba(255,0,0,0.35) 0%,
rgba(80,0,0,0.15) 25%,
rgba(0,0,0,1) 70%);
color:white;
position:relative;
}

/* ★ النجوم ★ */
body::before{
content:"";
position:absolute;
inset:0;
background-image:
radial-gradient(white 1px, transparent 1px),
radial-gradient(red 1px, transparent 1px);
background-size:60px 60px,120px 120px;
background-position:0 0,30px 30px;
opacity:.25;
animation:stars 20s linear infinite;
pointer-events:none;
}

@keyframes stars{
from{
transform:translateY(0);
}
to{
transform:translateY(-80px);
}
}

/* ★ الشريط العلوي ★ */
.top-alert{
width:100%;
height:48px;
background:linear-gradient(to right,#700,#d00,#700);
display:flex;
align-items:center;
justify-content:center;
font-size:15px;
font-weight:bold;
box-shadow:0 0 20px red;
position:relative;
z-index:10;
}

/* ★ شريط الأزرار ★ */
.top-menu{
width:100%;
overflow-x:auto;
white-space:nowrap;
background:#050505;
border-bottom:2px solid #300;
padding:10px 5px;
display:flex;
gap:10px;
scrollbar-width:none;
}

.top-menu::-webkit-scrollbar{
display:none;
}

.menu-btn{
flex:none;
padding:12px 20px;
border-radius:12px;
background:#120000;
border:1px solid #500;
color:#ff5a5a;
font-weight:bold;
box-shadow:
0 0 10px rgba(255,0,0,.3),
inset 0 0 10px rgba(255,0,0,.2);
transition:.3s;
}

.menu-btn:hover{
background:#300;
transform:scale(1.05);
}

/* ★ محتوى الصفحة ★ */
.main{
height:calc(100vh - 120px);
display:flex;
flex-direction:column;
justify-content:space-between;
align-items:center;
padding:10px;
position:relative;
}

/* ★ بطاقة الحساب ★ */
.profile-box{
position:absolute;
top:10px;
right:10px;
display:flex;
align-items:center;
gap:10px;
padding:8px 15px;
border-radius:40px;
background:rgba(20,0,0,.9);
border:2px solid red;
box-shadow:0 0 20px red;
z-index:5;
}

.profile-box img{
width:55px;
height:55px;
border-radius:50%;
border:2px solid #ff4444;
object-fit:cover;
}

.profile-name{
font-weight:bold;
color:#ff4444;
font-size:18px;
}

/* ★ الشعار ★ */
.logo{
margin-top:60px;
text-align:center;
}

.logo h1{
font-size:42px;
color:#fff;
text-shadow:
0 0 10px red,
0 0 20px red,
0 0 40px red;
letter-spacing:3px;
}

.logo span{
display:block;
margin-top:5px;
font-size:18px;
color:#ff4444;
}

/* ★ شبكة البوابات ★ */
.portal-grid{
width:100%;
max-width:900px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:35px;
justify-items:center;
padding:20px;
}

/* ★ البوابات ★ */
.portal{
width:150px;
height:150px;
border-radius:50%;
position:relative;
background:
radial-gradient(circle,
rgba(255,80,0,.8),
rgba(80,0,0,.95));
border:4px solid #ff3300;
box-shadow:
0 0 20px red,
0 0 50px rgba(255,0,0,.7),
inset 0 0 30px orange;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
transition:.4s;
}

.portal:hover{
transform:scale(1.08) rotate(2deg);
box-shadow:
0 0 30px red,
0 0 70px orange;
}

.portal img{
width:85%;
height:85%;
object-fit:cover;
border-radius:50%;
border:3px solid rgba(255,255,255,.15);
}

/* ★ اسم البوابة ★ */
.portal-title{
position:absolute;
bottom:-28px;
left:50%;
transform:translateX(-50%);
background:linear-gradient(to right,#700,#d00,#700);
padding:6px 15px;
border-radius:20px;
font-size:13px;
white-space:nowrap;
box-shadow:0 0 10px red;
}

/* ★ الشريط السفلي ★ */
.bottom-bar{
width:100%;
display:flex;
justify-content:space-around;
align-items:center;
padding:10px 0;
}

.bottom-icon{
width:65px;
height:65px;
border-radius:20px;
background:
linear-gradient(to bottom,#300,#100);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
box-shadow:
0 0 15px rgba(255,0,0,.5);
border:2px solid #500;
transition:.3s;
}

.bottom-icon:hover{
transform:translateY(-5px) scale(1.05);
box-shadow:0 0 20px red;
}

/* ★ الهاتف ★ */
@media(max-width:700px){

.logo h1{
font-size:28px;
}

.portal-grid{
grid-template-columns:repeat(2,1fr);
gap:50px 10px;
}

.portal{
width:120px;
height:120px;
}

.profile-box{
transform:scale(.85);
transform-origin:top right;
}

.bottom-icon{
width:55px;
height:55px;
font-size:22px;
}

}

</style>
</head>

<body>

<div class="main">

</div>

</div>

<!-- ★ البوابات ★ -->
<div class="portal-grid">

</div>

</div>

<div class="portal">
<img src="https://i.imgur.com/6VBx3io.jpeg">
<div class="portal-title">قسم المهام</div>
</div>

<div class="portal">
<img src="https://i.imgur.com/mYmmbrp.jpeg">
<div class="portal-title">مركز الأرواح</div>
</div>

<div class="portal">

</div>

<div class="portal">
<img src="https://i.imgur.com/GZy7GQp.jpeg">

</div>

</div>

<!-- ★ الشريط السفلي ★ -->
<div class="bottom-bar">

<div class="bottom-icon">🏆</div>
<div class="bottom-icon">📰</div>

</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kage No Teio</title>
  <style>
    /* Global Styles */
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    /* موقع الرئيسي Styles */
    #main-site {
      position: relative;
      width: 100%;
      height: 100vh;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
    }

    #main-site .character {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
    }

    #main-site .button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #f00;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- موقع الرئيسي -->
  <div id="main-site">
    <div class="character">
      <3DObject src="character.glb" alt="Character"></3DObject>
    </div>
    <div class="button">متابعة</div>
  </div>
</body>
</html>

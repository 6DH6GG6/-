<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-deep:   #1a0812;
    --pink-mid:    #2d0d1f;
    --pink-accent: #8b1a5a;
    --pink-bright: #c0396b;
    --pink-glow:   #e8609a;
    --pink-light:  #f4aac8;
    --pink-pale:   #fde8f0;
    --gold:        #d4a843;
    --text-main:   #fde8f0;
    --text-sub:    #c490aa;
    --text-dim:    #7a4460;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--pink-deep);
    min-height: 100vh;
    color: var(--text-main);
    overflow-x: hidden;
  }

  /* ━━━ INTRO SCREEN ━━━ */
  #introScreen {
    position: fixed; inset: 0; z-index: 1000;
    background: linear-gradient(145deg, #1a0812 0%, #2d0a1c 40%, #1f0a1a 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
  }

  #introScreen::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(192,57,107,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(139,26,90,0.10) 0%, transparent 50%);
  }

  .intro-badge {
    font-size: 11px; letter-spacing: 5px;
    color: var(--text-dim); text-transform: uppercase;
    margin-bottom: 24px; position: relative; z-index: 1;
  }

  .intro-num {
    font-family: 'Amiri', serif;
    font-size: 15px;
    color: var(--pink-glow);
    text-align: center;
    line-height: 2.2;
    position: relative; z-index: 1;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  .intro-num span {
    display: block;
    color: var(--text-sub);
    font-size: 13px;
    letter-spacing: 2px;
  }

  .intro-divider {
    width: 180px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink-accent), transparent);
    margin: 20px auto;
    position: relative; z-index: 1;
  }

  .enter-btn {
    position: relative; z-index: 1;
    margin-top: 12px;
    padding: 16px 56px;
    background: linear-gradient(135deg, var(--pink-accent), var(--pink-bright));
    border: none; border-radius: 4px;
    color: var(--pink-pale);
    font-family: 'Tajawal', sans-serif;
    font-size: 16px; font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow:
      0 0 30px rgba(192,57,107,0.35),
      0 4px 20px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
    transition: box-shadow 0.2s, transform 0.15s;
    text-transform: uppercase;
  }

  .enter-btn::before {
    content: '';
    position: absolute; inset: -1px;
    border-radius: 5px;
    background: linear-gradient(135deg, rgba(232,96,154,0.4), transparent);
    z-index: -1;
  }

  .enter-btn:hover {
    box-shadow: 0 0 50px rgba(232,96,154,0.5), 0 4px 24px rgba(0,0,0,0.6);
    transform: translateY(-2px);
  }

  .enter-btn:active { transform: translateY(0); }

  /* ━━━ MAIN DASHBOARD ━━━ */
  #dashboard {
    display: none;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(192,57,107,0.1) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(139,26,90,0.08) 0%, transparent 45%),
      var(--pink-deep);
  }

  .dash-header {
    background: rgba(13,4,10,0.9);
    border-bottom: 1px solid rgba(192,57,107,0.2);
    padding: 24px 32px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  .dash-header::after {
    content: '';
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 50%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,96,154,0.4), transparent);
  }

  .dash-title {
    font-family: 'Amiri', serif;
    font-size: 22px;
    color: var(--pink-glow);
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(232,96,154,0.3);
  }

  .dash-title span { color: var(--gold); margin: 0 8px; }

  /* ━━━ 3×3 GRID ━━━ */
  .grid-wrap {
    padding: 48px 32px;
    max-width: 900px;
    margin: 0 auto;
  }

  .grid-label {
    text-align: center;
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .grid-label::before, .grid-label::after {
    content: '✦';
    color: var(--pink-accent);
    margin: 0 12px;
    font-size: 8px;
  }

  .grid3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .btn-card {
    background: linear-gradient(160deg, rgba(45,13,31,0.9), rgba(26,8,18,0.95));
    border: 1px solid rgba(192,57,107,0.2);
    border-radius: 8px;
    padding: 28px 16px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.18s;
    text-align: center;
  }

  .btn-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--pink-bright), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-card:hover {
    border-color: rgba(232,96,154,0.5);
    box-shadow: 0 8px 32px rgba(139,26,90,0.3), 0 0 20px rgba(192,57,107,0.1);
    transform: translateY(-4px);
  }

  .btn-card:hover::before { opacity: 1; }

  .btn-icon {
    font-size: 32px;
    margin-bottom: 12px;
    display: block;
    filter: drop-shadow(0 0 8px rgba(232,96,154,0.4));
  }

  .btn-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .btn-sub {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  .open-btn {
    margin-top: 14px;
    width: 100%;
    padding: 8px;
    background: linear-gradient(135deg, rgba(139,26,90,0.3), rgba(192,57,107,0.2));
    border: 1px solid rgba(192,57,107,0.35);
    border-radius: 3px;
    color: var(--pink-light);
    font-family: 'Tajawal', sans-serif;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.2s, border-color 0.2s;
  }

  .open-btn:hover {
    background: linear-gradient(135deg, rgba(192,57,107,0.4), rgba(232,96,154,0.3));
    border-color: rgba(232,96,154,0.6);
  }

  /* ━━━ DROPDOWN ━━━ */
  .overlay { position:fixed; inset:0; z-index:400; display:none; }
  .overlay.open { display:block; }

  .dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 50%; transform: translateX(50%);
    z-index: 500;
    min-width: 240px;
    background: linear-gradient(160deg, #1f0817, #0d0409);
    border: 1px solid rgba(192,57,107,0.4);
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(139,26,90,0.15);
    overflow: hidden;
    display: none;
  }

  .dropdown.open { display: block; }

  .drop-head {
    padding: 10px 14px;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--pink-accent);
    text-transform: uppercase;
    border-bottom: 1px solid rgba(192,57,107,0.15);
    background: rgba(192,57,107,0.06);
  }

  .drop-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    font-size: 13px;
    color: var(--text-sub);
    cursor: pointer;
    border-bottom: 1px solid rgba(192,57,107,0.06);
    transition: background 0.15s, color 0.15s;
    font-family: 'Tajawal', sans-serif;
  }

  .drop-item:hover {
    background: rgba(192,57,107,0.1);
    color: var(--pink-light);
  }

  .drop-item .ico {
    font-size: 14px; width: 18px; text-align: center;
  }

  /* ━━━ AUDIO ━━━ */
  audio { display: none; }
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="xxxx.ogg" type="audio/ogg">
</audio>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<!-- ━━━ INTRO SCREEN ━━━ -->
<div id="introScreen">
  <div class="intro-badge">✦ لوحة التحكم ✦</div>

  <div class="intro-num">
    <span>الوصف الأول</span>
    ◆ بوابة الملفات والمحتوى ◆
    <span>الوصف الثاني</span>
    ◆ منظمة ومرتبة بدقة ◆
    <span>الوصف الثالث</span>
    ◆ كل شيء في مكانه ◆
  </div>

  <div class="intro-divider"></div>

  <button class="enter-btn" onclick="enterDash()">
    ✦ &nbsp; دخول &nbsp; ✦
  </button>
</div>

<!-- ━━━ DASHBOARD ━━━ -->
<div id="dashboard">
  <header class="dash-header">
    <div class="dash-title"><span>◆</span> لوحة الملفات <span>◆</span></div>
  </header>

  <div class="grid-wrap">
    <div class="grid-label">اختر القسم</div>
    <div class="grid3" id="mainGrid3"></div>
  </div>
</div>

<script>
  // ── بيانات الأزرار ──
  const sections = [
    { label: "صور",              icon: "🖼️", sub: "ملفات الصور",    js: "data/photos.js",    items: ["photo_01.js","photo_02.js","photo_03.js","photo_04.js"] },
    { label: "فيديوهات",         icon: "🎬", sub: "ملفات الفيديو",  js: "data/videos.js",    items: ["video_01.js","video_02.js","video_03.js"] },
    { label: "روابط",            icon: "🔗", sub: "ملفات الروابط",  js: "data/links.js",     items: ["links_01.js","links_02.js","links_03.js","links_04.js","links_05.js"] },
    { label: "مدونات",           icon: "📝", sub: "ملفات المدونات", js: "data/blogs.js",     items: ["blog_01.js","blog_02.js","blog_03.js"] },
    { label: "أشخاص دعموني",     icon: "💎", sub: "ملفات الداعمين", js: "data/supporters.js",items: ["sup_01.js","sup_02.js","sup_03.js","sup_04.js"] },
    { label: "الإعدادات",        icon: "⚙️", sub: "ملفات الإعداد",  js: "data/settings.js",  items: ["config_01.js","config_02.js"] },
    { label: "الأرشيف",          icon: "📦", sub: "ملفات مؤرشفة",   js: "data/archive.js",   items: ["arch_01.js","arch_02.js","arch_03.js"] },
    { label: "الرسائل",          icon: "💬", sub: "ملفات الرسائل",  js: "data/messages.js",  items: ["msg_01.js","msg_02.js"] },
    { label: "اليوميات",         icon: "📖", sub: "ملفات اليوميات", js: "data/diary.js",     items: ["diary_01.js","diary_02.js","diary_03.js","diary_04.js"] },
  ];

  let activeId = null;

  function closeAll() {
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
    document.getElementById('overlay').classList.remove('open');
    activeId = null;
  }

  function toggleDrop(id) {
    const d = document.getElementById('drop-' + id);
    const wasOpen = d.classList.contains('open');
    closeAll();
    if (!wasOpen) {
      d.classList.add('open');
      document.getElementById('overlay').classList.add('open');
      activeId = id;
    }
  }

  function pickFile(js, file) {
    closeAll();
    const toast = document.createElement('div');
    toast.style.cssText = `
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
      background:linear-gradient(135deg,#1f0817,#2d0d1f);
      border:1px solid rgba(192,57,107,0.5); border-radius:4px;
      padding:12px 26px; color:#f4aac8; font-size:13px;
      font-family:'Tajawal',sans-serif; letter-spacing:1px;
      z-index:9999; box-shadow:0 8px 32px rgba(0,0,0,0.7);
    `;
    toast.textContent = `▶ تحميل: ${js} / ${file}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2800);
  }

  // Build 3×3 grid
  const grid = document.getElementById('mainGrid3');
  sections.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'btn-card';
    div.style.position = 'relative';
    div.innerHTML = `
      <span class="btn-icon">${s.icon}</span>
      <div class="btn-label">${s.label}</div>
      <div class="btn-sub">${s.sub}</div>
      <button class="open-btn" onclick="event.stopPropagation(); toggleDrop(${i})">
        ✦ فتح القائمة
      </button>
      <div class="dropdown" id="drop-${i}">
        <div class="drop-head">${s.js}</div>
        ${s.items.map(f => `
          <div class="drop-item" onclick="pickFile('${s.js}','${f}')">
            <span class="ico">📄</span>${f}
          </div>
        `).join('')}
      </div>
    `;
    grid.appendChild(div);
  });

  // Enter dashboard + play music
  function enterDash() {
    document.getElementById('introScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    const m = document.getElementById('bgMusic');
    m.play().catch(() => {});
  }
</script>
</body>
</html>

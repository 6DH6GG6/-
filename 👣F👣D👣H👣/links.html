<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الروابط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.link-item { margin-bottom:2rem; }

.link-desc {
  background:rgba(255,255,255,0.06);
  border-radius:10px 10px 0 0;
  padding:0.8rem 1rem;
  font-size:0.92rem; color:#ddd; line-height:1.6;
}

.link-btn {
  display:block; width:100%; border:none; cursor:pointer;
  position:relative; overflow:hidden;
  border-radius:0 0 12px 12px;
  transition:all 0.3s;
  text-decoration:none;
  border: 2px solid rgba(255,110,180,0.35);
  border-top:none;
}
.link-btn:hover { border-color:var(--pink); box-shadow:0 0 30px rgba(255,110,180,0.3); }

.link-img {
  width:100%; display:block;
  height:220px; object-fit:cover;
  transition:transform 0.4s;
}
.link-btn:hover .link-img { transform:scale(1.04); }

.link-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.1) 60%);
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:1.2rem;
  transition:all 0.3s;
}
.link-btn:hover .link-overlay { background:linear-gradient(to top, rgba(255,110,180,0.4) 0%, rgba(0,0,0,0.2) 60%); }

.link-cta {
  background:rgba(255,110,180,0.25); border:1px solid rgba(255,110,180,0.8);
  color:#fff; padding:0.5rem 1.5rem; border-radius:25px;
  font-family:'Cairo',sans-serif; font-size:0.9rem; font-weight:600;
  backdrop-filter:blur(8px);
  box-shadow:0 0 20px rgba(255,110,180,0.3);
  transition:all 0.3s;
}
.link-btn:hover .link-cta { background:rgba(255,110,180,0.7); }
</style>
</head>
<body>
<div class="stars-bg" id="starsContainer"></div>

<div class="page-wrap">
  <div class="section-title">🔗 الروابط المهمة</div>

  <!-- Link items — add more by copying this block -->
  <!-- Replace href with your external link, src with your image -->

  <div class="link-item">
    <div class="link-desc">🌐 وصف الرابط الأول — اضغط على الصورة لفتح الرابط</div>
    <span class="pink-strip"></span>
    <a class="link-btn" href="https://example.com" target="_blank" rel="noopener">
      <img class="link-img" src="https://picsum.photos/seed/lnk1/800/300" alt="رابط 1">
      <div class="link-overlay">
        <span class="link-cta">🔗 فتح الرابط</span>
      </div>
    </a>
  </div>

  <div class="link-item">
    <div class="link-desc">📱 وصف الرابط الثاني — استبدل الرابط بوجهتك الخاصة</div>
    <span class="pink-strip"></span>
    <a class="link-btn" href="https://example.com" target="_blank" rel="noopener">
      <img class="link-img" src="https://picsum.photos/seed/lnk2/800/300" alt="رابط 2">
      <div class="link-overlay">
        <span class="link-cta">🔗 فتح الرابط</span>
      </div>
    </a>
  </div>

  <div class="link-item">
    <div class="link-desc">💡 وصف الرابط الثالث — يمكنك تغيير الصورة ورابط الوجهة</div>
    <span class="pink-strip"></span>
    <a class="link-btn" href="https://example.com" target="_blank" rel="noopener">
      <img class="link-img" src="https://picsum.photos/seed/lnk3/800/300" alt="رابط 3">
      <div class="link-overlay">
        <span class="link-cta">🔗 فتح الرابط</span>
      </div>
    </a>
  </div>

  <div class="link-item">
    <div class="link-desc">🏆 وصف الرابط الرابع</div>
    <span class="pink-strip"></span>
    <a class="link-btn" href="https://example.com" target="_blank" rel="noopener">
      <img class="link-img" src="https://picsum.photos/seed/lnk4/800/300" alt="رابط 4">
      <div class="link-overlay">
        <span class="link-cta">🔗 فتح الرابط</span>
      </div>
    </a>
  </div>

</div>

<script>
const starsC=document.getElementById('starsContainer');
for(let i=0;i<180;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2.5+0.5;s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:${Math.random()*0.5+0.1};`;starsC.appendChild(s);}
const nav=document.createElement('nav');nav.id='main-nav';
nav.innerHTML=`<ul class="nav-links"><li><a href="index.html">🏠 الرئيسي</a></li><li><a href="news.html">📰 أحدث الأخبار</a></li><li><a href="videos.html">🎬 فيديوهات</a></li><li><a href="photos.html">🖼️ صور</a></li><li><a href="blogs.html">✍️ مدونات</a></li><li><a href="links.html" class="active">🔗 روابط</a></li><li><a href="info.html">ℹ️ معلومات</a></li></ul>`;
document.body.prepend(nav);
</script>
</body>
</html>

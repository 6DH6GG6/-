<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرض الصور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.photo-item { margin-bottom: 2rem; }

.photo-desc {
  background: rgba(255,255,255,0.06);
  border-radius: 10px 10px 0 0;
  padding: 0.8rem 1rem;
  font-size: 0.92rem;
  color: #ddd;
  line-height: 1.6;
}

.photo-card {
  border: 2px solid var(--red);
  border-top: none;
  border-radius: 0 0 12px 12px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: all 0.3s;
  box-shadow: 0 0 18px rgba(229,57,53,0.2);
  background: #0a0a0a;
  display:block; width:100%;
}
.photo-card:hover { box-shadow:0 0 35px rgba(229,57,53,0.45); transform:scale(1.01); }
.photo-card img {
  width:100%; display:block;
  max-height: 380px; object-fit: cover;
  transition: transform 0.4s;
}
.photo-card:hover img { transform:scale(1.04); }
.photo-card .overlay-hint {
  position:absolute; inset:0;
  background:rgba(0,0,0,0); transition:background 0.3s;
  display:flex; align-items:center; justify-content:center;
}
.photo-card:hover .overlay-hint { background:rgba(0,0,0,0.35); }
.overlay-hint span { opacity:0; font-size:2.5rem; transition:opacity 0.3s; }
.photo-card:hover .overlay-hint span { opacity:1; }

/* Fullscreen */
#fs-overlay { display:none; position:fixed; inset:0; z-index:9998; background:rgba(0,0,0,0.97); flex-direction:column; align-items:center; justify-content:center; }
#fs-overlay.open { display:flex; }
#fs-img { max-width:95vw; max-height:80vh; object-fit:contain; border-radius:10px; }
.fs-close { position:fixed; top:1rem; right:1.5rem; z-index:9999; font-size:2.2rem; cursor:pointer; color:rgba(255,255,255,0.6); transition:color 0.3s; line-height:1; }
.fs-close:hover { color:var(--pink); }
.fs-controls { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); display:flex; gap:0.8rem; z-index:9999; flex-wrap:wrap; justify-content:center; }
.fs-btn { background:rgba(255,110,180,0.2); border:1px solid var(--pink); color:#fff; padding:0.55rem 1.2rem; border-radius:30px; cursor:pointer; font-size:0.85rem; font-family:'Cairo',sans-serif; transition:all 0.3s; backdrop-filter:blur(8px); }
.fs-btn:hover { background:var(--pink); color:#000; }

.share-panel { display:none; position:fixed; bottom:5rem; left:50%; transform:translateX(-50%); background:rgba(15,0,20,0.95); border:1px solid rgba(255,110,180,0.4); border-radius:16px; padding:1rem; z-index:9999; flex-direction:row; gap:1rem; backdrop-filter:blur(15px); }
.share-panel.open { display:flex; }
.share-app { display:flex; flex-direction:column; align-items:center; gap:0.3rem; cursor:pointer; padding:0.5rem 0.8rem; border-radius:10px; transition:background 0.3s; color:#fff; text-decoration:none; font-size:0.75rem; }
.share-app:hover { background:rgba(255,110,180,0.2); }
.share-app .icon { font-size:1.8rem; }
</style>
</head>
<body>
<div class="stars-bg" id="starsContainer"></div>

<div class="page-wrap">
  <div class="section-title">🖼️ معرض الصور</div>

  <!-- Photo items — add more by copying this block -->

  <div class="photo-item">
    <div class="photo-desc">🌟 وصف الصورة الأولى — يمكن تعديل هذا الوصف ليناسب الصورة</div>
    <span class="pink-strip"></span>
    <div class="photo-card" onclick="openPhoto('https://picsum.photos/seed/royal1/800/500','وصف الصورة الأولى')">
      <img src="https://picsum.photos/seed/royal1/800/500" alt="صورة 1" loading="lazy">
      <div class="overlay-hint"><span>🔍</span></div>
    </div>
  </div>

  <div class="photo-item">
    <div class="photo-desc">✨ وصف الصورة الثانية — استبدل الرابط بصورتك الخاصة</div>
    <span class="pink-strip"></span>
    <div class="photo-card" onclick="openPhoto('https://picsum.photos/seed/royal2/800/500','وصف الصورة الثانية')">
      <img src="https://picsum.photos/seed/royal2/800/500" alt="صورة 2" loading="lazy">
      <div class="overlay-hint"><span>🔍</span></div>
    </div>
  </div>

  <div class="photo-item">
    <div class="photo-desc">💫 وصف الصورة الثالثة — يمكن وضع رابط خارجي لأي صورة</div>
    <span class="pink-strip"></span>
    <div class="photo-card" onclick="openPhoto('https://picsum.photos/seed/royal3/800/500','وصف الصورة الثالثة')">
      <img src="https://picsum.photos/seed/royal3/800/500" alt="صورة 3" loading="lazy">
      <div class="overlay-hint"><span>🔍</span></div>
    </div>
  </div>

  <div class="photo-item">
    <div class="photo-desc">👑 وصف الصورة الرابعة</div>
    <span class="pink-strip"></span>
    <div class="photo-card" onclick="openPhoto('https://picsum.photos/seed/royal4/800/500','وصف الصورة الرابعة')">
      <img src="https://picsum.photos/seed/royal4/800/500" alt="صورة 4" loading="lazy">
      <div class="overlay-hint"><span>🔍</span></div>
    </div>
  </div>

</div>

<!-- Fullscreen Viewer -->
<div id="fs-overlay">
  <span class="fs-close" onclick="closeFS()">✕</span>
  <img id="fs-img" src="" alt="">
  <div class="fs-controls">
    <button class="fs-btn" onclick="closeFS()">⬅️ رجوع</button>
    <button class="fs-btn" onclick="downloadPhoto()">⬇️ تحميل</button>
    <button class="fs-btn" onclick="toggleShare()">📤 مشاركة</button>
  </div>
  <div class="share-panel" id="sharePanel">
    <a class="share-app" id="shareWA" href="#" target="_blank" rel="noopener">
      <span class="icon">💬</span>واتساب
    </a>
    <a class="share-app" id="shareTG" href="#" target="_blank" rel="noopener">
      <span class="icon">✈️</span>تيليغرام
    </a>
    <a class="share-app" id="shareFB" href="#" target="_blank" rel="noopener">
      <span class="icon">📘</span>ماسنجر
    </a>
  </div>
</div>

<script>
let currentUrl = '';
const starsC = document.getElementById('starsContainer');
for (let i=0;i<180;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2.5+0.5;s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:${Math.random()*0.5+0.1};`;starsC.appendChild(s);}

function openPhoto(url, desc) {
  currentUrl = url;
  document.getElementById('fs-img').src = url;
  document.getElementById('fs-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  updateShareLinks(url, desc);
}
function closeFS() {
  document.getElementById('fs-overlay').classList.remove('open');
  document.getElementById('sharePanel').classList.remove('open');
  document.body.style.overflow = '';
}
function downloadPhoto() {
  const a = document.createElement('a'); a.href = currentUrl; a.download = 'photo.jpg'; a.target='_blank'; a.click();
}
function toggleShare() {
  document.getElementById('sharePanel').classList.toggle('open');
}
function updateShareLinks(url, desc) {
  const encoded = encodeURIComponent(url);
  const text = encodeURIComponent(desc + ' — ' + url);
  document.getElementById('shareWA').href = `https://wa.me/?text=${text}`;
  document.getElementById('shareTG').href = `https://t.me/share/url?url=${encoded}&text=${encodeURIComponent(desc)}`;
  document.getElementById('shareFB').href = `https://www.facebook.com/sharer/sharer.php?u=${encoded}`;
}
document.getElementById('fs-overlay').addEventListener('click',function(e){if(e.target===this)closeFS();});

// nav
const nav=document.createElement('nav');nav.id='main-nav';
nav.innerHTML=`<ul class="nav-links"><li><a href="index.html">🏠 الرئيسي</a></li><li><a href="news.html">📰 أحدث الأخبار</a></li><li><a href="videos.html">🎬 فيديوهات</a></li><li><a href="photos.html" class="active">🖼️ صور</a></li><li><a href="blogs.html">✍️ مدونات</a></li><li><a href="links.html">🔗 روابط</a></li><li><a href="info.html">ℹ️ معلومات</a></li></ul>`;
document.body.prepend(nav);
</script>
</body>
</html>

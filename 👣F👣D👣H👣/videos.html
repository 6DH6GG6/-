<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة الفيديوهات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.video-item { margin-bottom:2rem; }

.video-desc {
  background:rgba(255,255,255,0.06);
  border-radius:10px 10px 0 0;
  padding:0.8rem 1rem;
  font-size:0.92rem; color:#ddd; line-height:1.6;
}

.video-card {
  border: 2px solid var(--red);
  border-top:none;
  border-radius:0 0 12px 12px;
  overflow:hidden; cursor:pointer;
  position:relative; transition:all 0.3s;
  box-shadow:0 0 18px rgba(229,57,53,0.2);
  background:#0a0a0a;
}
.video-card:hover { box-shadow:0 0 35px rgba(229,57,53,0.45); }
.video-thumb {
  width:100%; height:240px; object-fit:cover;
  display:block; transition:transform 0.4s;
  background:linear-gradient(135deg,#1a0010,#0a0020);
}
.video-card:hover .video-thumb { transform:scale(1.03); }

.play-btn {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:65px; height:65px; border-radius:50%;
  background:rgba(255,110,180,0.35); backdrop-filter:blur(6px);
  border:2px solid rgba(255,110,180,0.7);
  display:flex; align-items:center; justify-content:center;
  font-size:1.8rem; transition:all 0.3s;
  box-shadow:0 0 25px rgba(255,110,180,0.4);
}
.video-card:hover .play-btn { background:rgba(255,110,180,0.6); transform:translate(-50%,-50%) scale(1.1); }

/* Fullscreen player */
#fs-overlay { display:none; position:fixed; inset:0; z-index:9998; background:#000; flex-direction:column; align-items:center; justify-content:center; }
#fs-overlay.open { display:flex; }
#fs-video { width:100%; max-width:900px; max-height:75vh; border-radius:8px; background:#000; }
.fs-close { position:fixed; top:1rem; right:1.5rem; z-index:9999; font-size:2.2rem; cursor:pointer; color:rgba(255,255,255,0.6); transition:color 0.3s; }
.fs-close:hover { color:var(--pink); }
.fs-controls { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); display:flex; gap:0.8rem; z-index:9999; flex-wrap:wrap; justify-content:center; }
.fs-btn { background:rgba(255,110,180,0.2); border:1px solid var(--pink); color:#fff; padding:0.55rem 1.2rem; border-radius:30px; cursor:pointer; font-size:0.85rem; font-family:'Cairo',sans-serif; transition:all 0.3s; }
.fs-btn:hover { background:var(--pink); color:#000; }
.share-panel { display:none; position:fixed; bottom:5rem; left:50%; transform:translateX(-50%); background:rgba(15,0,20,0.95); border:1px solid rgba(255,110,180,0.4); border-radius:16px; padding:1rem; z-index:9999; flex-direction:row; gap:1rem; }
.share-panel.open { display:flex; }
.share-app { display:flex; flex-direction:column; align-items:center; gap:0.3rem; cursor:pointer; padding:0.5rem 0.8rem; border-radius:10px; transition:background 0.3s; color:#fff; text-decoration:none; font-size:0.75rem; }
.share-app:hover { background:rgba(255,110,180,0.2); }
.share-app .icon { font-size:1.8rem; }
</style>
</head>
<body>
<div class="stars-bg" id="starsContainer"></div>

<div class="page-wrap">
  <div class="section-title">👑 قائمة الفيديوهات</div>

  <!-- Video items — add more by copying this block -->
  <!-- Replace video URL and thumbnail with your own links -->

  <div class="video-item">
    <div class="video-desc">🎬 عنوان الفيديو الأول — ضع وصفاً مناسباً هنا</div>
    <span class="pink-strip"></span>
    <div class="video-card" onclick="openVideo('https://www.w3schools.com/html/mov_bbb.mp4','عنوان الفيديو الأول')">
      <img class="video-thumb" src="https://picsum.photos/seed/vid1/800/450" alt="فيديو 1">
      <div class="play-btn">▶</div>
    </div>
  </div>

  <div class="video-item">
    <div class="video-desc">🎥 عنوان الفيديو الثاني — استبدل الرابط بفيديوك الخاص</div>
    <span class="pink-strip"></span>
    <div class="video-card" onclick="openVideo('https://www.w3schools.com/html/movie.mp4','عنوان الفيديو الثاني')">
      <img class="video-thumb" src="https://picsum.photos/seed/vid2/800/450" alt="فيديو 2">
      <div class="play-btn">▶</div>
    </div>
  </div>

  <div class="video-item">
    <div class="video-desc">📽️ عنوان الفيديو الثالث — يمكن استخدام روابط mp4 مباشرة</div>
    <span class="pink-strip"></span>
    <div class="video-card" onclick="openVideo('https://www.w3schools.com/html/mov_bbb.mp4','عنوان الفيديو الثالث')">
      <img class="video-thumb" src="https://picsum.photos/seed/vid3/800/450" alt="فيديو 3">
      <div class="play-btn">▶</div>
    </div>
  </div>

</div>

<!-- Fullscreen Player -->
<div id="fs-overlay">
  <span class="fs-close" onclick="closeFS()">✕</span>
  <video id="fs-video" controls autoplay></video>
  <div class="fs-controls">
    <button class="fs-btn" onclick="closeFS()">⬅️ رجوع</button>
    <button class="fs-btn" onclick="toggleShare()">📤 مشاركة</button>
  </div>
  <div class="share-panel" id="sharePanel">
    <a class="share-app" id="shareWA" href="#" target="_blank" rel="noopener"><span class="icon">💬</span>واتساب</a>
    <a class="share-app" id="shareTG" href="#" target="_blank" rel="noopener"><span class="icon">✈️</span>تيليغرام</a>
    <a class="share-app" id="shareFB" href="#" target="_blank" rel="noopener"><span class="icon">📘</span>ماسنجر</a>
  </div>
</div>

<script>
const starsC=document.getElementById('starsContainer');
for(let i=0;i<180;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2.5+0.5;s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:${Math.random()*0.5+0.1};`;starsC.appendChild(s);}

let curUrl='';
function openVideo(url, title){
  curUrl=url;
  document.getElementById('fs-video').src=url;
  document.getElementById('fs-overlay').classList.add('open');
  document.body.style.overflow='hidden';
  updateShareLinks(url,title);
}
function closeFS(){
  const v=document.getElementById('fs-video'); v.pause(); v.src='';
  document.getElementById('fs-overlay').classList.remove('open');
  document.getElementById('sharePanel').classList.remove('open');
  document.body.style.overflow='';
}
function toggleShare(){document.getElementById('sharePanel').classList.toggle('open');}
function updateShareLinks(url,title){
  const eu=encodeURIComponent(url),et=encodeURIComponent(title+' — '+url);
  document.getElementById('shareWA').href=`https://wa.me/?text=${et}`;
  document.getElementById('shareTG').href=`https://t.me/share/url?url=${eu}&text=${encodeURIComponent(title)}`;
  document.getElementById('shareFB').href=`https://www.facebook.com/sharer/sharer.php?u=${eu}`;
}

const nav=document.createElement('nav');nav.id='main-nav';
nav.innerHTML=`<ul class="nav-links"><li><a href="index.html">🏠 الرئيسي</a></li><li><a href="news.html">📰 أحدث الأخبار</a></li><li><a href="videos.html" class="active">🎬 فيديوهات</a></li><li><a href="photos.html">🖼️ صور</a></li><li><a href="blogs.html">✍️ مدونات</a></li><li><a href="links.html">🔗 روابط</a></li><li><a href="info.html">ℹ️ معلومات</a></li></ul>`;
document.body.prepend(nav);
</script>
</body>
</html>

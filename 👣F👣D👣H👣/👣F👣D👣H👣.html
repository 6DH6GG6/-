<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>إمبراطورية الظلال</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --purple-deep: #2d0050;
  --purple-mid:  #6b21a8;
  --purple-glow: #a855f7;
  --purple-light:#c084fc;
  --purple-pale: #e9d5ff;
  --ember-1:     #d946ef;
  --ember-2:     #a855f7;
  --ember-3:     #7c3aed;
  --dark:        #03000a;
}

html,body{
  width:100%;min-height:100vh;
  background:var(--dark);
  overflow-x:hidden;
  font-family:'Noto Naskh Arabic','Cinzel',serif;
  direction:rtl;
}

/* ══════════════════════
   CANVAS خلفية الجمر
══════════════════════ */
#ember-canvas{
  position:fixed;inset:0;z-index:0;
  pointer-events:none;
}

/* طبقة ضباب علوية */
#fog-layer{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 45% at 50% 100%, rgba(60,0,100,.55) 0%, transparent 65%),
    radial-gradient(ellipse 100% 55% at 50% 0%,  rgba(0,0,8,.92)   0%, transparent 75%),
    radial-gradient(ellipse 60% 60% at 20% 50%,  rgba(30,0,60,.3)  0%, transparent 70%),
    radial-gradient(ellipse 60% 60% at 80% 50%,  rgba(30,0,60,.3)  0%, transparent 70%);
}

/* ══════════════════════
   LAYOUT
══════════════════════ */
#page{
  position:relative;z-index:10;
  min-height:100vh;
  padding:44px 20px 100px;
  display:flex;flex-direction:column;align-items:center;
}

/* ══════════════════════
   HEADER
══════════════════════ */
#header{
  text-align:center;
  margin-bottom:36px;
  animation:fadeDown .9s cubic-bezier(.16,1,.3,1) both;
}

.divider-line{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-bottom:10px;
}
.divider-line span{
  flex:1;max-width:90px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.6),transparent);
}
.divider-line em{
  font-style:normal;
  font-family:'Cinzel',serif;
  font-size:8px;letter-spacing:7px;
  color:rgba(168,85,247,.45);
}

#main-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(22px,5vw,52px);
  font-weight:900;
  letter-spacing:clamp(5px,2vw,18px);
  background:linear-gradient(140deg,#c084fc 0%,#f0abfc 30%,#a855f7 60%,#e879f9 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 40px rgba(168,85,247,.75));
  margin-bottom:8px;
}
#sub-title{
  font-family:'Cinzel',serif;
  font-size:clamp(8px,1.1vw,11px);
  color:rgba(192,132,252,.4);
  letter-spacing:6px;
  text-transform:uppercase;
}

/* ══════════════════════
   SEARCH
══════════════════════ */
#search-wrap{
  width:min(640px,94vw);
  margin-bottom:28px;
  position:relative;
  animation:fadeDown .9s cubic-bezier(.16,1,.3,1) .1s both;
}
#search{
  width:100%;
  padding:14px 50px 14px 22px;
  background:rgba(8,0,18,.8);
  border:1px solid rgba(130,40,220,.35);
  border-top-color:rgba(210,100,255,.55);
  border-radius:2px;
  color:#e9d5ff;
  font-family:'Noto Naskh Arabic',serif;
  font-size:clamp(13px,1.7vw,15px);
  outline:none;
  backdrop-filter:blur(14px);
  text-align:right;direction:rtl;
  transition:border-color .3s,box-shadow .3s;
}
#search::placeholder{color:rgba(160,80,255,.3)}
#search:focus{
  border-color:rgba(168,85,247,.75);
  box-shadow:0 0 28px rgba(168,85,247,.2),inset 0 0 14px rgba(168,85,247,.06);
}
.s-icon{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  color:rgba(168,85,247,.45);font-size:15px;pointer-events:none;
}
.s-count{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  color:rgba(168,85,247,.35);font-size:9px;font-family:'Cinzel',serif;letter-spacing:1px;
}

/* ══════════════════════
   GRID
══════════════════════ */
#grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:clamp(14px,2.2vw,26px);
  width:min(960px,97vw);
  animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .22s both;
}

@media(max-width:700px){
  #grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:701px) and (max-width:900px){
  #grid{grid-template-columns:repeat(3,1fr)}
}

/* ══════════════════════
   CARD — الشكل الجديد
══════════════════════ */
.card{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  text-decoration:none;
  cursor:pointer;
  animation:cardIn .7s cubic-bezier(.16,1,.3,1) both;
}
.card.hidden{display:none}

/* الإطار الخارجي للصورة — مستطيل بنسبة ذهبية */
.card-frame{
  position:relative;
  width:100%;
  aspect-ratio:3/4;          /* نسبة تجعل الصورة واضحة وممتلئة */
  overflow:hidden;
  background:#06000f;
  /* إطار بنفسجي ثنائي اللون — علوي فاتح، بقية داكن */
  border-top:2px solid rgba(210,110,255,.65);
  border-left:1px solid rgba(130,50,210,.3);
  border-right:1px solid rgba(130,50,210,.3);
  border-bottom:1px solid rgba(80,20,160,.2);
  transition:border-color .35s,box-shadow .35s,transform .35s;
}

.card:hover .card-frame{
  border-top-color:rgba(240,160,255,.9);
  border-left-color:rgba(180,90,255,.6);
  border-right-color:rgba(180,90,255,.6);
  border-bottom-color:rgba(140,60,255,.45);
  box-shadow:
    0 0 0 1px rgba(168,85,247,.15),
    0 0 30px rgba(168,85,247,.4),
    0 0 70px rgba(168,85,247,.18),
    inset 0 0 24px rgba(168,85,247,.07);
  transform:translateY(-4px);
}

/* الصورة — تملأ الإطار بالكامل بوضوح تام */
.card-img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center top;   /* تعلو الوجه للأعلى */
  display:block;
  filter:brightness(.9) contrast(1.05) saturate(1.1);
  transition:transform .55s cubic-bezier(.16,1,.3,1),filter .35s;
}
.card:hover .card-img{
  transform:scale(1.06);
  filter:brightness(1.05) contrast(1.05) saturate(1.2);
}

/* توهج أعلى الصورة لحد ملعوم */
.card-top-glow{
  position:absolute;top:0;left:0;right:0;height:40%;
  background:linear-gradient(180deg,rgba(192,90,255,.12) 0%,transparent 100%);
  pointer-events:none;
  opacity:0;transition:opacity .35s;
}
.card:hover .card-top-glow{opacity:1}

/* ظل أسفل الصورة — يساعد على قراءة الاسم */
.card-shadow-bottom{
  position:absolute;bottom:0;left:0;right:0;height:35%;
  background:linear-gradient(0deg,rgba(3,0,12,.85) 0%,transparent 100%);
  pointer-events:none;
}

/* رقم العضو */
.card-id{
  position:absolute;top:8px;right:10px;
  font-family:'Cinzel',serif;font-size:8px;
  color:rgba(192,132,252,.35);letter-spacing:1px;
  transition:color .3s;
}
.card:hover .card-id{color:rgba(230,170,255,.75)}

/* placeholder عند غياب الصورة */
.card-placeholder{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(155deg,#0c0018 0%,#180030 50%,#060010 100%);
}
.card-placeholder-icon{font-size:clamp(26px,4vw,42px);filter:drop-shadow(0 0 12px rgba(168,85,247,.55))}
.card-placeholder-txt{font-family:'Cinzel',serif;font-size:8px;color:rgba(192,132,252,.3);letter-spacing:3px}

/* ══ اسم العضو تحت الإطار ══ */
.card-name-wrap{
  width:100%;
  margin-top:0;          /* ملاصق للإطار تماماً */
  padding:10px 8px 8px;
  background:rgba(6,0,14,.82);
  border:1px solid rgba(100,30,180,.25);
  border-top:none;       /* بدون حد علوي — يكمل الإطار */
  backdrop-filter:blur(6px);
  text-align:center;
  transition:background .35s,border-color .35s;
}
.card:hover .card-name-wrap{
  background:rgba(30,0,60,.88);
  border-color:rgba(168,85,247,.4);
}

.card-name{
  font-family:'Noto Naskh Arabic',serif;
  font-size:clamp(11px,1.2vw,14px);
  font-weight:700;
  color:rgba(225,185,255,.88);
  letter-spacing:.4px;
  line-height:1.4;
  text-shadow:0 0 16px rgba(168,85,247,.55);
  transition:color .3s,text-shadow .3s;
}
.card:hover .card-name{
  color:#f0abfc;
  text-shadow:0 0 24px rgba(240,171,252,.85);
}

/* خط ديكوري داخل الـ name-wrap */
.card-name-line{
  width:0%;height:1px;margin:5px auto 0;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.6),transparent);
  transition:width .4s cubic-bezier(.16,1,.3,1);
}
.card:hover .card-name-line{width:70%}

/* ══════════════════════
   NO RESULTS
══════════════════════ */
#no-results{
  display:none;grid-column:1/-1;
  text-align:center;padding:60px;
  font-family:'Cinzel',serif;
  color:rgba(168,85,247,.3);
  font-size:13px;letter-spacing:3px;
}

/* ══════════════════════
   REFRESH BUTTON
══════════════════════ */
#refresh-btn{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  z-index:200;
  display:flex;align-items:center;gap:10px;
  padding:13px 32px;
  background:rgba(8,0,18,.88);
  border:1px solid rgba(168,85,247,.4);
  border-top-color:rgba(220,120,255,.65);
  border-radius:1px;
  color:rgba(220,160,255,.85);
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:4px;
  cursor:pointer;backdrop-filter:blur(18px);
  text-transform:uppercase;
  transition:all .28s;
  box-shadow:0 0 22px rgba(168,85,247,.12);
}
#refresh-btn:hover{
  background:rgba(168,85,247,.16);
  border-color:rgba(192,132,252,.75);
  color:#f0abfc;
  box-shadow:0 0 35px rgba(168,85,247,.3),0 10px 28px rgba(0,0,0,.55);
}
#refresh-btn:active{transform:translateX(-50%) scale(.97)}
#refresh-btn .ref-icon{
  font-size:16px;display:inline-block;
  transition:transform .55s cubic-bezier(.16,1,.3,1);
}
#refresh-btn:hover .ref-icon{transform:rotate(360deg)}

/* ══════════════════════
   ANIMATIONS
══════════════════════ */
@keyframes fadeDown{
  from{opacity:0;transform:translateY(-22px)} to{opacity:1;transform:translateY(0)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)}
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(18px) scale(.94)} to{opacity:1;transform:translateY(0) scale(1)}
}
</style>
</head>
<body>

<!-- خلفية الجمر -->
<canvas id="ember-canvas"></canvas>
<div id="fog-layer"></div>

<!-- المحتوى -->
<div id="page">

  <!-- هيدر -->
  <div id="header">
    <div class="divider-line">
      <span></span>
      <em>⬡ · SHADOW EMPIRE · ⬡</em>
      <span></span>
    </div>
    <div id="main-title">إمبراطورية الظلال</div>
    <div id="sub-title">REALM OF ETERNAL SHADOWS</div>
  </div>

  <!-- بحث -->
  <div id="search-wrap">
    <input id="search" type="text" placeholder="ابحث بالاسم أو الرقم..." autocomplete="off"/>
    <span class="s-icon">⬡</span>
    <span class="s-count" id="s-count"></span>
  </div>

  <!-- الشبكة -->
  <div id="grid">
    <!-- الكروت تُبنى بـ JS -->
    <div id="no-results">✦ لا توجد نتائج ✦</div>
  </div>

</div>

<!-- زر تحديث -->
<button id="refresh-btn">
  <span class="ref-icon">↻</span>
  تحديث
</button>

<script>
/* ══════════════════════
   بيانات الأعضاء
══════════════════════ */
var BASE = 'https://6dh6gg6.github.io/-/';
var MEMBERS = [
  { id:'001', name:'جلجامشة الوردية',  img:'https://i.imgur.com/sDYtHw5.jpg',  href: BASE + '👣F👣D👣H👣/👣♤l💩جلجامشة💩l♤👣/👣GLGMSHA👣.html' },
  { id:'002', name:'سيد الظلام',        img:'https://i.imgur.com/8Km9tLL.jpg',  href: BASE + '002.html' },
  { id:'003', name:'الأمير الأسود',     img:'https://i.imgur.com/4nXHx3e.jpg',  href: BASE + '003.html' },
  { id:'004', name:'حارس العرش',        img:'https://i.imgur.com/2yaf2ig.jpg',  href: BASE + '004.html' },
  { id:'005', name:'فارس العاصفة',      img:'https://i.imgur.com/Q3oSEaP.jpg',  href: BASE + '005.html' },
  { id:'006', name:'شبح الليل',         img:'https://i.imgur.com/xGR3ybQ.jpg',  href: BASE + '006.html' },
  { id:'007', name:'ملك الرماد',        img:'https://i.imgur.com/oVfKorR.jpg',  href: BASE + '007.html' },
  { id:'008', name:'وريث الأبدية',      img:'https://i.imgur.com/XMFnQkR.jpg',  href: BASE + '008.html' },
  { id:'009', name:'صياد الأرواح',      img:'https://i.imgur.com/6n3sCOc.jpg',  href: BASE + '009.html' },
  { id:'010', name:'سيف القدر',         img:'https://i.imgur.com/Lx7B4vP.jpg',  href: BASE + '010.html' },
];

/* ══════════════════════
   بناء الكروت
══════════════════════ */
var grid = document.getElementById('grid');
var noRes = document.getElementById('no-results');

MEMBERS.forEach(function(m, i){
  var a = document.createElement('a');
  a.className = 'card';
  a.href = m.href;
  a.setAttribute('data-name', m.name);
  a.setAttribute('data-id', m.id);
  a.style.animationDelay = (i * 0.07).toFixed(2) + 's';

  var imgHTML = m.img
    ? `<img class="card-img" src="${m.img}" alt="${m.name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
       <div class="card-placeholder" style="display:none">
         <div class="card-placeholder-icon">🔮</div>
         <div class="card-placeholder-txt">قريباً</div>
       </div>`
    : `<div class="card-placeholder">
         <div class="card-placeholder-icon">🔮</div>
         <div class="card-placeholder-txt">قريباً</div>
       </div>`;

  a.innerHTML = `
    <div class="card-frame">
      ${imgHTML}
      <div class="card-top-glow"></div>
      <div class="card-shadow-bottom"></div>
      <div class="card-id">#${m.id}</div>
    </div>
    <div class="card-name-wrap">
      <div class="card-name">${m.name}</div>
      <div class="card-name-line"></div>
    </div>`;

  grid.insertBefore(a, noRes);
});

/* ══════════════════════
   بحث
══════════════════════ */
var searchEl = document.getElementById('search');
var sCount   = document.getElementById('s-count');
var cards    = document.querySelectorAll('.card');

function doSearch(){
  var q = searchEl.value.trim().toLowerCase();
  var visible = 0;
  cards.forEach(function(c){
    var ok = !q
      || c.getAttribute('data-name').toLowerCase().includes(q)
      || c.getAttribute('data-id').includes(q);
    c.classList.toggle('hidden', !ok);
    if(ok) visible++;
  });
  noRes.style.display = visible === 0 ? 'block' : 'none';
  sCount.textContent = q ? (visible + '/10') : '';
}
searchEl.addEventListener('input', doSearch);

/* ══════════════════════
   تحديث
══════════════════════ */
document.getElementById('refresh-btn').addEventListener('click', function(){
  var g = document.getElementById('grid');
  g.style.transition = 'opacity .3s';
  g.style.opacity = '0';
  setTimeout(function(){
    searchEl.value = '';
    doSearch();
    g.style.opacity = '1';
  }, 300);
});

/* ══════════════════════
   جمر بنفسجي — Canvas
══════════════════════ */
(function(){
  var cv  = document.getElementById('ember-canvas');
  var ctx = cv.getContext('2d');
  var W, H;

  function resize(){
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  /* ── جسيمات الجمر ── */
  var EMBERS = [];
  var MAX = 140;

  function newEmber(startFromBottom){
    return {
      x    : Math.random() * W,
      y    : startFromBottom ? H + Math.random() * 80 : Math.random() * H,
      r    : Math.random() * 3 + 0.5,
      vy   : -(Math.random() * 0.65 + 0.18),
      vx   : (Math.random() - 0.5) * 0.3,
      life : 1,
      decay: Math.random() * 0.0035 + 0.0015,
      wave : Math.random() * Math.PI * 2,
      wSpd : Math.random() * 0.018 + 0.006,
      wAmp : Math.random() * 0.55 + 0.2,
      hue  : 265 + Math.random() * 65,   /* 265–330: بنفسجي → وردي */
    };
  }

  for(var i = 0; i < MAX; i++) EMBERS.push(newEmber(false));

  /* ── دخان خفيف ── */
  var SMOKES = [];
  var SMAX = 28;
  function newSmoke(){
    return {
      x : Math.random() * W,
      y : H * .55 + Math.random() * H * .45,
      r : Math.random() * 70 + 35,
      vy: -(Math.random() * .15 + .05),
      a : Math.random() * .08 + .03,
      da: Math.random() * .0003 + .0001,
    };
  }
  for(var s = 0; s < SMAX; s++) SMOKES.push(newSmoke());

  /* ── حلقات توهج كبيرة ببطء ── */
  var HALOS = [
    { x:.25, y:.8, r:220, hue:280, speed:.0003, t:0 },
    { x:.75, y:.9, r:180, hue:310, speed:.0004, t:1 },
    { x:.5,  y:1,  r:260, hue:265, speed:.00025,t:2 },
  ];

  function draw(){
    /* مسح شفاف — يخلق ذيولاً */
    ctx.fillStyle = 'rgba(3,0,10,.16)';
    ctx.fillRect(0,0,W,H);

    /* حلقات توهج */
    HALOS.forEach(function(h){
      h.t += h.speed;
      var pulse = 1 + Math.sin(h.t) * 0.08;
      var px = h.x * W, py = h.y * H;
      var g = ctx.createRadialGradient(px,py,0,px,py,h.r*pulse);
      g.addColorStop(0, 'hsla('+h.hue+',80%,35%,.08)');
      g.addColorStop(.5,'hsla('+h.hue+',70%,25%,.04)');
      g.addColorStop(1, 'hsla('+h.hue+',60%,15%,0)');
      ctx.beginPath();ctx.arc(px,py,h.r*pulse,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });

    /* دخان */
    SMOKES.forEach(function(sm){
      sm.y  += sm.vy;
      sm.a  -= sm.da;
      if(sm.a <= 0){ Object.assign(sm,newSmoke()); return; }
      var g = ctx.createRadialGradient(sm.x,sm.y,0,sm.x,sm.y,sm.r);
      g.addColorStop(0,'rgba(50,0,80,'+sm.a+')');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(sm.x,sm.y,sm.r,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });

    /* جمر */
    EMBERS.forEach(function(em){
      em.wave += em.wSpd;
      em.x    += em.vx + Math.sin(em.wave) * em.wAmp;
      em.y    += em.vy;
      em.life -= em.decay;

      if(em.life <= 0 || em.y < -20){
        Object.assign(em, newEmber(true));
        return;
      }

      var a = em.life;

      /* نواة الجمرة */
      var g = ctx.createRadialGradient(em.x,em.y,0,em.x,em.y,em.r*3);
      g.addColorStop(0,  'hsla('+em.hue+',100%,95%,'+a+')');
      g.addColorStop(.25,'hsla('+em.hue+',95%,70%,'+(a*.85)+')');
      g.addColorStop(.6, 'hsla('+(em.hue-15)+',85%,45%,'+(a*.4)+')');
      g.addColorStop(1,  'hsla('+(em.hue-25)+',75%,25%,0)');
      ctx.beginPath();ctx.arc(em.x,em.y,em.r,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();

      /* هالة حول الجمرات الكبيرة */
      if(em.r > 1.8){
        var g2 = ctx.createRadialGradient(em.x,em.y,0,em.x,em.y,em.r*8);
        g2.addColorStop(0,'hsla('+em.hue+',100%,75%,'+(a*.15)+')');
        g2.addColorStop(1,'hsla('+em.hue+',80%,40%,0)');
        ctx.beginPath();ctx.arc(em.x,em.y,em.r*8,0,Math.PI*2);
        ctx.fillStyle=g2;ctx.fill();
      }
    });

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>

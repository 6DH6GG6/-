<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>جلخامشة الوديّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>

<style>
/* ============================================================
   RESET & BASE
============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;min-height:100%;
  background:#000;
  font-family:'Tajawal','Amiri',sans-serif;
  direction:rtl;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ============================================================
   SPLASH — التضبيب
============================================================ */
#splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:32px;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  transition:opacity .6s ease, visibility .6s ease;
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none;}

#splash-title{
  font-size:clamp(1.5rem,6vw,2.8rem);
  font-weight:900;
  color:#cc0000;
  text-align:center;
  line-height:1.45;
  padding:0 24px;
  text-shadow:0 0 20px #cc000066;
}

#splash-btn{
  width:80px;height:80px;
  border-radius:50%;
  border:3px solid #cc3300;
  background:radial-gradient(circle at 40% 35%,#3a0000,#000);
  color:#ff6644;
  font-size:2.2rem;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 0 24px #cc330066,inset 0 0 16px #33000088;
  outline:none;
  position:relative;
  transition:box-shadow .2s,border-color .2s;
}
#splash-btn:hover{
  box-shadow:0 0 36px #cc3300aa,inset 0 0 22px #55000099;
  border-color:#ff4411;
}
#splash-btn:active{transform:scale(.95);}

/* ============================================================
   LOADING BAR — خط التحميل
============================================================ */
#loader-screen{
  position:fixed;inset:0;z-index:9998;
  background:#000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:28px;
  opacity:0;visibility:hidden;
  transition:opacity .3s;
}
#loader-screen.show{opacity:1;visibility:visible;}
#loader-screen.hide{opacity:0;visibility:hidden;}

.loader-title{
  font-size:clamp(1rem,3.5vw,1.6rem);
  color:#ff69b4;
  font-weight:700;
  letter-spacing:3px;
  opacity:.85;
}
.loader-bar-wrap{
  width:min(340px,80vw);
  height:8px;
  background:#1a0010;
  border-radius:99px;
  overflow:hidden;
  border:1px solid #ff2e2e33;
  box-shadow:0 0 18px #ff2e2e22;
}
.loader-bar-fill{
  height:100%;
  width:0%;
  border-radius:99px;
  background:linear-gradient(90deg,#ff0055,#ff69b4,#ff0055);
  background-size:200% 100%;
  animation:barShine 1.2s linear infinite;
  transition:width .05s linear;
}
@keyframes barShine{
  0%{background-position:0% 50%}
  100%{background-position:200% 50%}
}
.loader-percent{
  font-size:1rem;
  color:#ff8fab;
  font-weight:700;
  letter-spacing:2px;
}

/* ============================================================
   MAIN APP
============================================================ */
#app{
  display:none;
  flex-direction:column;
  min-height:100vh;
}
#app.visible{display:flex;}

/* ============================================================
   NAV — شريط الأقسام
============================================================ */
#nav-bar{
  position:sticky;top:0;z-index:500;
  background:linear-gradient(180deg,#0d000a,#130008);
  border-bottom:1.5px solid #ff2e2e33;
  box-shadow:0 2px 24px #ff000022;
  padding:0 4px;
  display:flex;
  align-items:center;
  min-height:54px;
  gap:6px;
  overflow:hidden;
}

/* زر السحب يمين/يسار */
.nav-scroll-btn{
  flex-shrink:0;
  width:32px;height:40px;
  background:none;border:none;
  color:#ff69b4;
  font-size:1.2rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;
  transition:background .2s;
  z-index:2;
}
.nav-scroll-btn:hover{background:#ff2e2e22;}

/* حاوية الأزرار القابلة للتمرير */
#nav-list{
  display:flex;
  flex-direction:row;
  gap:6px;
  overflow-x:auto;
  scroll-behavior:smooth;
  scrollbar-width:none;
  flex:1;
  padding:8px 4px;
  -webkit-overflow-scrolling:touch;
}
#nav-list::-webkit-scrollbar{display:none;}

.nav-btn{
  flex-shrink:0;
  padding:7px 16px;
  border-radius:99px;
  border:1.5px solid #ff2e2e55;
  background:#0d000a;
  color:#ff8fab;
  font-family:'Tajawal',sans-serif;
  font-size:clamp(.78rem,2.5vw,.92rem);
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:background .2s,border-color .2s,color .2s,box-shadow .2s;
}
.nav-btn:hover{
  background:#2a000f;
  border-color:#ff2e2e;
  color:#fff;
}
.nav-btn.active{
  background:linear-gradient(135deg,#6e0020,#3a0010);
  border-color:#ff2e2e;
  color:#fff;
  box-shadow:0 0 14px #ff2e2e55;
}

/* ============================================================
   CONTENT AREA
============================================================ */
#content{
  flex:1;
  position:relative;
  background:#000;
}

/* ============================================================
   AUDIO PLAYER — خفي
============================================================ */
#bg-audio{display:none;}

/* ============================================================
   STARS CANVAS — الخلفية العامة
============================================================ */
#stars-global{
  position:fixed;inset:0;
  z-index:0;
  pointer-events:none;
}

/* ============================================================
   HOME SECTION
============================================================ */
#section-home{
  position:relative;
  min-height:calc(100vh - 54px);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 16px 60px;
  z-index:1;
}

.home-profile-wrap{
  display:flex;flex-direction:column;align-items:center;
  gap:10px;
  margin-bottom:28px;
}
.home-avatar{
  width:clamp(100px,28vw,150px);
  height:clamp(100px,28vw,150px);
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ff69b4;
  box-shadow:0 0 22px #ff69b455;
  display:block;
}
.home-avatar-ph{
  width:clamp(100px,28vw,150px);
  height:clamp(100px,28vw,150px);
  border-radius:50%;
  border:3px solid #ff69b4;
  background:#1a0010;
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;
  box-shadow:0 0 22px #ff69b455;
}
.home-name{
  font-size:clamp(1.3rem,4.5vw,2rem);
  font-weight:900;
  color:#ff69b4;
  text-shadow:0 0 14px #ff69b466;
  text-align:center;
}

/* إشعارات */
.notif-list{
  width:100%;max-width:500px;
  display:flex;flex-direction:column;
  gap:12px;
}
.notif-card{
  background:linear-gradient(135deg,#110008ee,#1e000dee);
  border:1.5px solid #ff2e2e44;
  border-radius:14px;
  padding:14px 16px;
  cursor:pointer;
  transition:border-color .2s,box-shadow .2s,transform .2s;
  position:relative;
  overflow:hidden;
}
.notif-card:hover{
  border-color:#ff2e2e;
  box-shadow:0 4px 24px #ff2e2e33;
  transform:translateY(-2px);
}
.notif-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:6px;
}
.notif-dot{
  width:11px;height:11px;
  border-radius:50%;
  flex-shrink:0;
}
.notif-dot.green{background:#22ff88;box-shadow:0 0 8px #22ff8888;}
.notif-dot.red  {background:#ff2e2e;box-shadow:0 0 8px #ff2e2e88;}

.notif-section-name{
  font-size:.88rem;font-weight:700;
  color:#ff69b4;flex:1;
}
.notif-badge{
  background:#ff2e2e;
  color:#fff;
  font-size:.7rem;
  font-weight:900;
  border-radius:99px;
  padding:1px 7px;
  min-width:20px;
  text-align:center;
}
.notif-msg{
  font-size:.84rem;
  color:#ffd6e7cc;
  margin-bottom:6px;
  padding-right:21px;
}
.notif-time{
  font-size:.75rem;
  color:#ff8fab66;
  padding-right:21px;
}

/* ============================================================
   UTILITY: section wrapper
============================================================ */
.sec-wrap{
  position:relative;z-index:1;
  min-height:calc(100vh - 54px);
}

/* ============================================================
   RESPONSIVE TWEAKS
============================================================ */
@media(max-width:400px){
  .nav-btn{padding:6px 11px;font-size:.73rem;}
}
</style>
</head>
<body>

<!-- ══════════════ AUDIO ══════════════ -->
<audio id="bg-audio" loop preload="auto">
  <source src="Tooop.ogg" type="audio/ogg"/>
</audio>

<!-- ══════════════ STARS GLOBAL ══════════════ -->
<canvas id="stars-global"></canvas>

<!-- ══════════════ SPLASH ══════════════ -->
<div id="splash">
  <p id="splash-title">أهلاً بك يا عزيزي المشاهد</p>
  <button id="splash-btn" aria-label="دخول">🔱</button>
</div>

<!-- ══════════════ LOADER ══════════════ -->
<div id="loader-screen">
  <p class="loader-title">جاري التحميل…</p>
  <div class="loader-bar-wrap">
    <div class="loader-bar-fill" id="loader-fill"></div>
  </div>
  <p class="loader-percent" id="loader-pct">0%</p>
</div>

<!-- ══════════════ APP ══════════════ -->
<div id="app">

  <!-- NAV -->
  <nav id="nav-bar" aria-label="أقسام الموقع">
    <button class="nav-scroll-btn" id="nav-left"  aria-label="يسار">&#8250;</button>
    <div id="nav-list" role="tablist">
      <button class="nav-btn active" data-section="home"       role="tab">🏠 الرئيسي</button>
      <button class="nav-btn"        data-section="news"       role="tab">📰 أحدث الأخبار</button>
      <button class="nav-btn"        data-section="videos"     role="tab">🎬 فيديوهات</button>
      <button class="nav-btn"        data-section="photos"     role="tab">🖼 صور</button>
      <button class="nav-btn"        data-section="blogs"      role="tab">📝 مدونات</button>
      <button class="nav-btn"        data-section="links"      role="tab">🔗 روابط</button>
      <button class="nav-btn"        data-section="info"       role="tab">ℹ️ معلومات</button>
      <button class="nav-btn"        data-section="supporters" role="tab">💖 من دعموني</button>
    </div>
    <button class="nav-scroll-btn" id="nav-right" aria-label="يمين">&#8249;</button>
  </nav>

  <!-- CONTENT -->
  <main id="content"></main>

</div><!-- /#app -->

<!-- ══════════════ SCRIPTS ══════════════ -->
<!--
  ضع ملفات JS في نفس مجلد SSS.html
  الترتيب مهم: SSS.html يُحمّلها عند الطلب فقط (lazy)
-->

<script>
/* ============================================================
   STARS UTILITY
============================================================ */
(function(){
  const c = document.getElementById('stars-global');
  function draw(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=0;i<280;i++){
      const x=Math.random()*c.width, y=Math.random()*c.height;
      const r=Math.random()*1.3+.2, a=Math.random()*.7+.15;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${a})`;
      ctx.fill();
    }
  }
  draw();
  window.addEventListener('resize',draw);
})();

/* ============================================================
   SPLASH → LOADER → APP
============================================================ */
(function(){
  const splash      = document.getElementById('splash');
  const splashBtn   = document.getElementById('splash-btn');
  const loaderScr   = document.getElementById('loader-screen');
  const loaderFill  = document.getElementById('loader-fill');
  const loaderPct   = document.getElementById('loader-pct');
  const app         = document.getElementById('app');
  const audio       = document.getElementById('bg-audio');

  splashBtn.addEventListener('click', startLoader);

  function startLoader(){
    // أخفِ السبلاش
    splash.classList.add('hidden');

    // أظهر اللودر
    loaderScr.classList.add('show');

    // شريط تحميل وهمي فخم
    let pct = 0;
    const steps = [
      {target:30, speed:22},
      {target:65, speed:35},
      {target:88, speed:18},
      {target:100,speed:28}
    ];
    let stepIdx = 0;

    function tick(){
      if(pct >= 100){
        loaderFill.style.width = '100%';
        loaderPct.textContent  = '100%';
        setTimeout(showApp, 300);
        return;
      }
      const s = steps[stepIdx];
      if(pct >= s.target && stepIdx < steps.length-1) stepIdx++;
      pct = Math.min(pct + (Math.random()*.8+.4), 100);
      loaderFill.style.width = pct+'%';
      loaderPct.textContent  = Math.floor(pct)+'%';
      setTimeout(tick, steps[stepIdx].speed);
    }
    tick();
  }

  function showApp(){
    loaderScr.classList.remove('show');
    loaderScr.classList.add('hide');
    app.classList.add('visible');

    // تشغيل الموسيقى
    audio.volume = .45;
    audio.play().catch(()=>{
      // محاولة ثانية عند أول تفاعل
      document.addEventListener('click',()=>audio.play(),{once:true});
    });

    // عرض القسم الرئيسي
    window.SiteRouter.go('home');
  }
})();

/* ============================================================
   ROUTER — تحميل ملفات JS عند الطلب
============================================================ */
window.SiteRouter = (function(){
  const content = document.getElementById('content');
  const navBtns = document.querySelectorAll('.nav-btn');

  // خريطة القسم → ملف JS → دالة التهيئة
  const SECTIONS = {
    home      : { file: null,           init: showHome       },
    news      : { file: 'news.js',      init: ()=> callInit('NewsSection')       },
    videos    : { file: 'videos.js',    init: ()=> callInit('VideosSection')     },
    photos    : { file: 'photos.js',    init: ()=> callInit('PhotosSection')     },
    blogs     : { file: 'blogs.js',     init: ()=> callInit('BlogsSection')      },
    links     : { file: 'links.js',     init: ()=> callInit('LinksSection')      },
    info      : { file: 'info.js',      init: ()=> callInit('InfoSection')       },
    supporters: { file: 'supporters.js',init: ()=> callInit('SupportersSection') },
  };

  const loaded = new Set(['home']);
  let current  = null;

  function callInit(globalName){
    if(window[globalName] && window[globalName].init){
      window[globalName].init(content);
    } else {
      content.innerHTML = `<p style="color:#ff69b4;text-align:center;padding:60px 20px;font-size:1.1rem;">⚠️ الملف غير موجود أو لم يُحمَّل بعد</p>`;
    }
  }

  function loadScript(file, cb){
    if(loaded.has(file)){ cb(); return; }
    const s = document.createElement('script');
    s.src = file;
    s.onload  = ()=>{ loaded.add(file); cb(); };
    s.onerror = ()=>{ console.warn('فشل تحميل:',file); cb(); };
    document.body.appendChild(s);
  }

  function go(sectionId){
    if(current === sectionId) return;
    current = sectionId;

    // تحديث الأزرار
    navBtns.forEach(b=>{
      b.classList.toggle('active', b.dataset.section === sectionId);
    });

    const sec = SECTIONS[sectionId];
    if(!sec){ return; }

    if(sec.file){
      loadScript(sec.file, sec.init);
    } else {
      sec.init();
    }

    // تحديث hash بدون عرض اسم الملف
    history.replaceState(null,'','#'+sectionId);
  }

  // ربط أزرار الناف
  navBtns.forEach(btn=>{
    btn.addEventListener('click',()=> go(btn.dataset.section));
  });

  return { go };
})();

/* ============================================================
   NAV SCROLL BUTTONS
============================================================ */
(function(){
  const list  = document.getElementById('nav-list');
  const btnL  = document.getElementById('nav-left');
  const btnR  = document.getElementById('nav-right');
  const AMT   = 140;
  btnL.addEventListener('click',()=> list.scrollBy({left: AMT,behavior:'smooth'}));
  btnR.addEventListener('click',()=> list.scrollBy({left:-AMT,behavior:'smooth'}));
})();

/* ============================================================
   HOME SECTION
============================================================ */
function showHome(){
  const content = document.getElementById('content');

  /* ─── بيانات قابلة للتعديل ─── */
  const HOME_AVATAR = "https://i.pravatar.cc/300?img=47";  // ← غيّر رابط الصورة

  /* ─── إشعارات — عدّل هنا ─── */
  const NOTIFICATIONS = [
    {
      section   : 'news',
      label     : '📰 أحدث الأخبار',
      dotColor  : 'green',          // green | red
      badge     : 3,                // عدد الأخبار
      message   : 'تم إضافة 3 أخبار جديدة!',
      time      : '2025/01/15 — 10:30 م'
    },
    {
      section   : 'videos',
      label     : '🎬 فيديوهات',
      dotColor  : 'red',
      badge     : 1,
      message   : 'فيديو جديد تم رفعه الآن',
      time      : '2025/01/14 — 08:00 م'
    },
    {
      section   : 'photos',
      label     : '🖼 صور',
      dotColor  : 'green',
      badge     : 5,
      message   : 'تمت إضافة 5 صور جديدة',
      time      : '2025/01/13 — 04:15 م'
    },
    {
      section   : 'blogs',
      label     : '📝 مدونات',
      dotColor  : 'red',
      badge     : 2,
      message   : 'مدونتان جديدتان في انتظارك',
      time      : '2025/01/12 — 09:00 ص'
    },
  ];

  /* ─── بناء HTML ─── */
  const notifHTML = NOTIFICATIONS.map(n => `
    <div class="notif-card" data-goto="${n.section}">
      <div class="notif-header">
        <span class="notif-dot ${n.dotColor}"></span>
        <span class="notif-section-name">${n.label}</span>
        <span class="notif-badge">${n.badge}</span>
      </div>
      <p class="notif-msg">${n.message}</p>
      <p class="notif-time">🕐 ${n.time}</p>
    </div>
  `).join('');

  const avatarHTML = HOME_AVATAR
    ? `<img class="home-avatar" src="${HOME_AVATAR}" alt="جلخامشة الوديّة" onerror="this.outerHTML='<div class=home-avatar-ph>👤</div>'">`
    : `<div class="home-avatar-ph">👤</div>`;

  content.innerHTML = `
    <div id="section-home">
      <div class="home-profile-wrap">
        ${avatarHTML}
        <h1 class="home-name">جلخامشة الوديّة</h1>
      </div>
      <div class="notif-list">${notifHTML}</div>
    </div>
  `;

  // ربط الإشعارات بالأقسام
  content.querySelectorAll('.notif-card').forEach(card=>{
    card.addEventListener('click',()=>{
      window.SiteRouter.go(card.dataset.goto);
    });
  });
}
</script>

</body>
</html>
